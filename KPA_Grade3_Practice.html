<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142e26">
<title>KPA 지도자 3급 모의시험</title>
<style>
:root{color-scheme:light;--ink:#152c23;--muted:#506256;--dark:#142e26;--green:#23634c;--lime:#def487;--paper:#f5f7f2;--line:#dbe3d9;--white:#fff;--soft:#e9f2e7;--red:#a33831;--redbg:#fff0ed;--round:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.55}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #45845a;outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
a{color:var(--green)}
.wrap{width:min(1080px,calc(100% - 48px));margin:auto}
header{background:var(--dark);color:white}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:72px}
.brand{background:none;border:0;color:#fff;text-align:left;font-weight:760;padding:0;white-space:nowrap}
.brand-mark{display:inline-grid;place-items:center;background:var(--lime);color:var(--dark);width:32px;height:32px;border-radius:8px;margin-right:8px;font-size:13px;font-weight:900}
.nav{display:flex;gap:4px}
.nav button{background:none;color:#d7e5db;border:1px solid transparent;border-radius:8px;padding:7px 11px;font-size:14px}
.nav button[aria-current=page]{color:#fff;border-color:#567365;background:#254238}
main{padding:28px 0 44px;min-height:calc(100vh - 150px)}
.hero{position:relative;overflow:hidden;background:var(--dark);color:white;border-radius:var(--round);padding:44px 36px 40px;margin-bottom:32px}
.hero-content{position:relative;z-index:1}
.hero h1{margin:8px 0 12px;font-size:clamp(32px,5.5vw,62px);line-height:1.13;letter-spacing:-.06em}
.hero p{margin:0;color:#d8e5db;max-width:34ch}
.eyebrow{font-weight:750;font-size:14px;color:var(--green)}
.hero .eyebrow{color:var(--lime)}
.court{width:355px;height:172px;position:absolute;right:-12px;bottom:18px;transform:rotate(-25deg);border:2px solid #6e9281;border-radius:4px;background:linear-gradient(90deg,transparent 33%,#6e9281 33% 33.65%,#1d493a 33.65% 49.7%,#6e9281 49.7% 50.3%,#1d493a 50.3% 66.35%,#6e9281 66.35% 67%,transparent 67%),linear-gradient(0deg,transparent 49.4%,#6e9281 49.4% 50.6%,transparent 50.6%);opacity:.76}
.court::after{content:"";position:absolute;width:54px;height:54px;top:26px;right:72px;border-radius:50%;background:radial-gradient(circle at 9px 9px,#48613b 1.9px,transparent 2.3px) 1px 1px/14px 14px,var(--lime);box-shadow:0 6px 15px #0003}
h2,h3,p{overflow-wrap:anywhere}
h1,h2,h3{line-height:1.3;letter-spacing:-.035em}
h2{font-size:25px;margin:0 0 8px}
.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px;gap:8px}
.section-head p,.muted{color:var(--muted);margin:0}
.syllabus{margin-top:16px}.syllabus ul{columns:2;padding-left:20px;margin:0}.syllabus li{break-inside:avoid;margin-bottom:4px}.sets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.set,.panel{background:white;border:1px solid var(--line);border-radius:var(--round)}
.set{padding:20px;display:flex;flex-direction:column;min-height:185px}
.set h3{font-size:22px;margin:4px 0 10px}
.set p{margin:0 0 20px;font-size:14px;color:var(--muted)}
.set-actions,.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;font-weight:720;line-height:1.35}
.btn:hover:not(:disabled){background:var(--soft)}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--dark)}
.btn.primary:hover:not(:disabled){background:#cee870}
.btn.small{font-size:14px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:16px 0 22px}
.exam-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.panel{padding:22px}
.exam-head{margin-bottom:16px}
.exam-head h1,.page-title{font-size:clamp(26px,4vw,38px);margin:4px 0 8px}
.question-title{font-size:clamp(21px,3vw,29px);margin:12px 0 20px}
.choices{display:grid;gap:9px}
.choice{text-align:left;display:flex;align-items:center;gap:12px;min-height:56px;width:100%;padding:10px 12px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--ink)}
.choice:hover{background:#f0f6ee}
.choice[aria-pressed=true]{background:#edf6d2;border-color:#5b7b37;font-weight:700}
.choice-key{width:30px;height:30px;flex:none;border-radius:6px;display:grid;place-items:center;background:#edf1ec;color:var(--green);font-weight:750}
.choice[aria-pressed=true] .choice-key{background:var(--green);color:white}
.exam-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:20px}
.progress-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:730}
progress{width:100%;height:8px;appearance:none;display:block;margin:12px 0 14px;background:#eef2ed;border:none;border-radius:4px;overflow:hidden}
progress::-webkit-progress-bar{background:#eef2ed}
progress::-webkit-progress-value{background:var(--green)}
progress::-moz-progress-bar{background:var(--green)}
.numbers{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:12px 0 14px}
.number{min-width:0;min-height:36px;border-radius:6px;background:#fff;border:1px solid var(--line);color:var(--ink);padding:0;font-size:14px}
.number.done{background:var(--soft);color:var(--green)}
.number[aria-current=true]{box-shadow:inset 0 0 0 2px var(--green);font-weight:800}
.sidebar>.btn{width:100%}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.status{font-size:14px;margin:0 0 12px;color:var(--green)}
.score{margin-bottom:18px}
.score strong{display:block;font-size:clamp(42px,8vw,72px);line-height:1;letter-spacing:-.07em;margin:10px 0 12px}
.score strong span{font-size:22px;color:var(--muted);letter-spacing:0}
.score p{margin:0 0 16px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.filters button[aria-pressed=true]{background:var(--dark);border-color:var(--dark);color:white}
.review-list{display:grid;gap:10px}
details.panel{padding:0}
summary{cursor:pointer;padding:16px;list-style:none;display:flex;align-items:flex-start;gap:10px;font-weight:700}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:20px;font-weight:500;line-height:1.2}
details[open]>summary::after{content:"−"}
.review-body{padding:0 16px 16px}
.review-body p{margin:8px 0}
.pill{display:inline-block;white-space:nowrap;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:750;background:var(--soft);color:var(--green)}
.pill.wrong{background:var(--redbg);color:var(--red)}
.ref{font-size:14px;color:var(--muted)}
.memo{display:block;margin-top:14px;font-size:14px;font-weight:750}
textarea{display:block;width:100%;min-height:74px;resize:vertical;border:1px solid #b8c7bb;border-radius:8px;padding:8px 10px;margin:4px 0 10px;font:inherit}
.review-options{margin:8px 0;padding-left:28px;color:var(--muted)}
.review-options .correct{color:var(--green);font-weight:750}
dialog{border:1px solid var(--line);border-radius:var(--round);padding:22px;width:min(440px,calc(100% - 32px));color:var(--ink)}
dialog::backdrop{background:#142e2680}
dialog p{color:var(--muted)}
dialog .actions{justify-content:flex-end}
[hidden]{display:none!important}
@media(max-width:820px){.sets{grid-template-columns:repeat(2,minmax(0,1fr))}.court{right:-105px;opacity:.52}.exam-layout{grid-template-columns:minmax(0,1fr) 220px}}
@media(max-width:620px){.wrap{width:calc(100% - 28px)}.top{min-height:60px}.brand-mark{display:none}.brand{font-size:14px}.nav button{padding:6px 7px}.hero{padding:28px 18px}.court{right:-175px;bottom:-58px;opacity:.33}.sets,.exam-layout{grid-template-columns:1fr}.syllabus ul{columns:1}.set{min-height:0;padding:16px}.set p{margin-bottom:12px}.panel{padding:16px}.section-head{align-items:start;flex-direction:column}.numbers{grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}.number{min-height:38px}.question-title{margin-top:10px}}
.study-entry,.study-tools{margin:16px 0}.study{margin:16px 0}.study h3{margin-bottom:4px}.study h3+p{margin-top:4px}.study table{width:100%;border-collapse:collapse;line-height:1.6}.study th,.study td{text-align:left;vertical-align:top;padding:9px;border-bottom:1px solid var(--line)}.study th{background:var(--soft)}.study td:first-child{width:24%;font-weight:700}.study small{color:var(--muted);white-space:nowrap}.study p{line-height:1.75}
@media print{header,.study-tools,footer{display:none}main.wrap{width:100%;margin:0;padding:0}.study{border:0;padding:0;margin:12px 0}.study h2,.study h3{break-after:avoid}.study tr,.study p{break-inside:avoid}body{background:white;font-size:10pt}.study table{font-size:9pt}.study h2{font-size:15pt}}
.topic-list{padding-inline-start:1.25em}.topic-list li{margin:.55em 0;line-height:1.65}@media print{.topic-list li{break-inside:avoid}}
.study-fig{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fafcf8;break-inside:avoid}.study-fig svg{width:100%;max-width:540px;height:auto;display:block;margin:auto;fill:var(--ink);font-family:inherit}.study-fig figcaption{margin:8px auto 0;max-width:64ch;font-size:15px;color:var(--muted)}@media print{.study-fig svg{max-width:350px}.study-fig figcaption{font-size:9pt}}
.serve-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}.serve-grid figure{margin:0;padding:12px;border:1px solid var(--line);border-radius:8px;break-inside:avoid}.serve-grid svg{width:100%;height:auto}.serve-grid text{text-anchor:middle;font:600 16px system-ui;fill:var(--ink)}.serve-grid p{margin:4px 0}.serve-grid strong{white-space:nowrap;color:var(--green)}@media print{.serve-grid{grid-template-columns:1fr 1fr}.serve-grid svg{max-height:95px}}</style>
</head>
<body>
<header><div class="wrap top"><button class="brand" data-act="home"><span class="brand-mark" aria-hidden="true">KPA</span>지도자 3급 모의시험</button><nav class="nav" aria-label="주 메뉴"><button id="nav-home" data-act="home">모의시험</button><button id="nav-notes" data-act="notes">오답노트 <span id="note-count"></span></button></nav></div></header>
<main id="app" class="wrap"></main>
<footer><div class="wrap">출제 기준 · 2026 대한피클볼협회 공식 피클볼 규정집 (ver3)<br>학습용 모의문항 · 풀이 기록과 메모는 이 브라우저에 저장됩니다.</div></footer>

<script id="bank" type="application/json">[{"id":1,"title":"제1회 모의고사","questions":[{"id":"1-1","set":1,"number":1,"chapter":13,"topic":"제13장 · 네트 및 네트 지지 시스템","level":"중","rule":"13.D.1","stem":"랠리 중 리턴이 네트와 네트 기둥 사이의 틈을 통과했다. 판정은?","options":["네트 높이보다 위로 가면 무조건 유효","리턴한 선수의 폴트","항상 리플레이","상대 코트 안에 들어가면 유효"],"answer":1,"explanation":"네트와 기둥 사이의 틈을 통해 볼을 치면 폴트다."},{"id":"1-2","set":1,"number":2,"chapter":4,"topic":"제4장 · 득점","level":"하","rule":"4.A","stem":"표준 득점 방식에서 점수를 얻는 경우는?","options":["리시브 팀이 랠리에서 이겼을 때","서브가 올바른 서비스 코트에 떨어진 즉시","어느 쪽이든 랠리에서 이겼을 때","서브 팀이 랠리에서 이겼을 때"],"answer":3,"explanation":"표준 방식에서는 서브 팀이 랠리를 이겨야 득점한다."},{"id":"1-3","set":1,"number":3,"chapter":10,"topic":"제10장 · 랠리 상황","level":"하","rule":"10.A","stem":"투 바운스 룰에서 의무적으로 바운스해야 하는 볼의 조합은?","options":["서브와 그 서브의 첫 리턴","모든 랠리의 모든 타구","서브 하나만","각 팀의 두 번째 리턴"],"answer":0,"explanation":"서브를 받는 팀은 서브를, 서빙 팀은 그 리턴을 각각 한 번 바운스시킨 뒤 친다."},{"id":"1-4","set":1,"number":4,"chapter":5,"topic":"제5장 · 선수 위치 및 서브 순서","level":"중","rule":"5.A.1","stem":"표준 단식에서 서버가 5점, 리시버가 2점이다. 서버의 서브 구역은?","options":["오른쪽","서버가 자유롭게 선택","왼쪽","직전 랠리에서 리시버가 선 쪽"],"answer":2,"explanation":"단식 서버는 자신의 점수가 홀수이면 왼쪽, 0이나 짝수이면 오른쪽에서 서브한다."},{"id":"1-5","set":1,"number":5,"chapter":15,"topic":"제15장 · 토너먼트 종목 및 점수 옵션","level":"하","rule":"15.B.4","stem":"리그전에서 우승 결정의 첫 기준은?","options":["매치별 첫 랠리 득점 수","모든 게임의 득점 합계","매치 승리 수","마지막 매치 점수 차"],"answer":2,"explanation":"우승은 매치 승리 수를 우선 비교하며, 동률일 때 정해진 타이브레이커를 적용한다."},{"id":"1-6","set":1,"number":6,"chapter":6,"topic":"제6장 · 선수 준비 상태와 점수 공지","level":"하","rule":"6.B.2","stem":"표준 복식의 게임 첫 점수 공지는?","options":["1–0–2","0–0","0–0–2","0–0–1"],"answer":2,"explanation":"경기를 시작하는 팀은 첫 로테이션에서 두 번째 서버로 시작한다."},{"id":"1-7","set":1,"number":7,"chapter":19,"topic":"제19장 · 토너먼트 라인 콜","level":"하","rule":"19.A.1","stem":"심판이 진행하는 매치에서 심판이 콜해야 하는 항목은?","options":["서브 풋 폴트","선수의 응원 요청","관중의 자리 이동","상대 팀 타이브레이커 순위"],"answer":0,"explanation":"심판은 서브 풋 폴트, 숏 서브, 논발리 존 폴트를 콜한다."},{"id":"1-8","set":1,"number":8,"chapter":9,"topic":"제9장 · 데드볼·폴트·방해요소","level":"중","rule":"9.C.1~2","stem":"옆 코트에서 볼이 굴러 들어와 플레이를 방해했고 선수가 방해요소를 콜했다. 처리 방법은?","options":["콜한 선수의 폴트","랠리 리플레이","서버에게 1점 부여","외부 볼만 제거하고 중단 시점부터 재개"],"answer":1,"explanation":"방해요소 콜로 데드볼이 되며 랠리를 다시 플레이한다."},{"id":"1-9","set":1,"number":9,"chapter":21,"topic":"제21장 · 타임아웃과 휴식","level":"중","rule":"21.A","stem":"토너먼트 21점 게임에서 단식 선수 또는 복식 팀에 허용되는 표준 타임아웃 횟수는?","options":["3회","1회","2회","4회"],"answer":0,"explanation":"11점과 15점 게임에서는 2회, 21점 게임에서는 3회다."},{"id":"1-10","set":1,"number":10,"chapter":25,"topic":"제25장 · 휠체어·어댑티브 스탠딩·하이브리드 복식","level":"중","rule":"25.C.1","stem":"하이브리드 복식의 팀 구성은?","options":["휠체어 선수 1명과 스탠딩 선수 1명","스탠딩 선수 2명만","반드시 휠체어 선수 2명","휠체어 선수 1명과 스탠딩 선수 2명"],"answer":0,"explanation":"스탠딩 선수 자리는 비장애 또는 어댑티브 스탠딩 선수가 맡을 수 있다."},{"id":"1-11","set":1,"number":11,"chapter":3,"topic":"제3장 · 코트 및 장비","level":"하","rule":"3.A.1","stem":"표준 피클볼 복식 코트의 폭과 길이는?","options":["20피트(240인치) × 40피트(480인치)","30피트(360인치) × 60피트(720인치)","20피트(240인치) × 44피트(528인치)","34피트(408인치) × 64피트(768인치)"],"answer":2,"explanation":"단식과 복식 모두 20피트(240인치) × 44피트(528인치) 코트를 사용한다. 경기장 표면 규격은 코트 규격과 별개다."},{"id":"1-12","set":1,"number":12,"chapter":18,"topic":"제18장 · 매치 전 선수 책임","level":"상","rule":"18.A.1~3","stem":"토너먼트 매치가 진행 중이다. 선수가 비규격 패들을 사용한 사실을 확인했다. 처리 방법은?","options":["해당 랠리만 리플레이","해당 선수의 매치 몰수","패들만 교체하고 경기 계속","해당 선수에게 구두 경고만 부과"],"answer":1,"explanation":"경기 전이면 무벌칙 교체, 진행 중이면 매치 몰수, 종료 후라면 매치 결과 유지다."},{"id":"1-13","set":1,"number":13,"chapter":7,"topic":"제7장 · 서브","level":"중","rule":"7.A.1~3","stem":"일반 선수의 서브 타격 순간, 발 조건에 맞는 경우는?","options":["한 발은 올바른 서브 구역, 다른 발은 반대 서브 구역 바닥에 있음","두 발 모두 공중에 있음","한 발은 올바른 서브 구역, 다른 발은 베이스라인 위에 있음","한 발만 올바른 서브 구역에 닿고 다른 발은 공중에 있음"],"answer":3,"explanation":"적어도 한 발은 올바른 서브 구역에 닿아야 한다. 어느 발도 코트 또는 서브 구역 바깥의 표면을 밟을 수 없다."},{"id":"1-14","set":1,"number":14,"chapter":11,"topic":"제11장 · 논발리 존 위반","level":"상","rule":"11.A.3","stem":"논발리 존에서 바운드 볼을 친 선수가 밖으로 점프했다. 두 발 모두 존 바깥 바닥에 닿기 전에 공중에서 다음 볼을 발리했다. 판정은?","options":["양 팀이 합의하면 리플레이","발리한 선수의 폴트","볼만 존 밖에 있으면 유효","존 밖 공중에서 쳤으므로 유효"],"answer":1,"explanation":"존에 닿은 뒤에는 두 발 모두 존 바깥 표면에 완전히 닿은 후에 발리해야 한다."},{"id":"1-15","set":1,"number":15,"chapter":1,"topic":"제1장 · 게임","level":"하","rule":"제1장 피클볼 소개","stem":"피클볼의 기본 경기 형태로 규정집에 소개된 것은?","options":["단식과 3인조 경기","복식만","복식과 4인조 경기","단식과 복식"],"answer":3,"explanation":"피클볼은 1대1 단식 또는 2대2 복식으로 플레이할 수 있다."},{"id":"1-16","set":1,"number":16,"chapter":2,"topic":"제2장 · 정의","level":"하","rule":"제2장 정의","stem":"리플레이를 가장 잘 설명한 것은?","options":["중단된 타구만 그 위치에서 다시 침","서버를 바꾼 후 다음 랠리를 시작함","점수와 서버를 유지하고 랠리를 처음부터 다시 함","상대 팀에 점수를 주고 랠리를 다시 함"],"answer":2,"explanation":"리플레이는 득점이나 서버 변경 없이 랠리를 다시 시작하는 것이다."},{"id":"1-17","set":1,"number":17,"chapter":14,"topic":"제14장 · 표준 피클볼 변형","level":"중","rule":"14.A.5","stem":"잠정 랠리 스코어링을 적용한 복식에서 서브 팀이 랠리에 패했다. 다음 서브는?","options":["바로 상대 팀으로 넘어간다.","같은 팀 파트너가 이어받는다.","서버가 반대쪽으로 이동해 다시 한다.","득점할 때까지 같은 서버가 한다."],"answer":0,"explanation":"이 방식에서는 한 팀의 서브 기회는 한 명의 서버에게만 주어진다. 패하면 바로 사이드 아웃이다."},{"id":"1-18","set":1,"number":18,"chapter":8,"topic":"제8장 · 라인 콜","level":"중","rule":"8.C, 3.A.4.c","stem":"서브 볼이 상대 논발리 존 경계선에 처음 떨어졌다. 판정은?","options":["인, 랠리 계속","아웃, 서버 폴트","리플레이","인, 서버 득점"],"answer":1,"explanation":"논발리 존 라인은 논발리 존에 속한다. 서브는 이 선을 넘어야 한다."},{"id":"1-19","set":1,"number":19,"chapter":20,"topic":"제20장 · 토너먼트 매치 상황","level":"중","rule":"20.H.1","stem":"심판 있는 대회에서 선수가 방해요소를 콜했지만 심판이 유효한 방해요소로 인정하지 않았다. 판정은?","options":["무조건 리플레이","타임아웃 자동 부여","상대 팀의 폴트","콜한 선수의 폴트"],"answer":3,"explanation":"심판이 방해요소 콜을 무효로 판단하면 콜한 선수에게 폴트가 부과된다."},{"id":"1-20","set":1,"number":20,"chapter":22,"topic":"제22장 · 비신사적인 행위 및 페널티","level":"상","rule":"22.E.1","stem":"0–6 상황에서 점수가 0인 팀에 테크니컬 파울이 부과됐다. 점수는?","options":["−1–6","1–6","0–5","0–7"],"answer":3,"explanation":"위반 팀이 0점인 경우 1점을 차감할 수 없어 상대 팀에 1점을 더한다."},{"id":"1-21","set":1,"number":21,"chapter":12,"topic":"제12장 · 플레이 중 패들","level":"중","rule":"12.C.1","stem":"랠리 중 패들 위에 볼을 얹어 운반한 다음 쳐도 합법이다.","options":["맞다","틀리다"],"answer":1,"explanation":"패들로 볼을 잡는 캐치나 운반하는 캐리는 폴트다."},{"id":"1-22","set":1,"number":22,"chapter":26,"topic":"부록 A · 폴트 및 리플레이","level":"중","rule":"부록 A.1 · 10.A.1","stem":"리시버가 서브를 바운스 전에 친 상황은 부록 A에서 리플레이로 분류된다.","options":["맞다","틀리다"],"answer":1,"explanation":"서브를 처음 받는 쪽에서 첫 바운스 전에 타격하면 리시버 폴트다."},{"id":"1-23","set":1,"number":23,"chapter":10,"topic":"제10장 · 랠리 상황","level":"중","rule":"10.E","stem":"헛스윙만으로 볼이 즉시 데드가 된다.","options":["맞다","틀리다"],"answer":1,"explanation":"헛스윙 자체는 데드볼을 만들지 않는다."},{"id":"1-24","set":1,"number":24,"chapter":3,"topic":"제3장 · 코트 및 장비","level":"하","rule":"3.A.4.c","stem":"논발리 존 라인은 논발리 존에 포함된다.","options":["맞다","틀리다"],"answer":0,"explanation":"라인을 밟은 상태에서 발리하면 논발리 존 접촉에 해당한다."},{"id":"1-25","set":1,"number":25,"chapter":23,"topic":"제23장 · 기권 및 취소","level":"상","rule":"23.B.4","stem":"대진을 취소하면 아직 플레이하지 않은 각 매치의 각 게임은 11–0 또는 종목의 승리 점수로 기록한다.","options":["맞다","틀리다"],"answer":1,"explanation":"대진 취소의 미진행 게임은 0–0으로 기록한다. 매치 기권 시 미진행 게임을 기록하는 기준과 구분한다."},{"id":"1-26","set":1,"number":26,"chapter":16,"topic":"제16장 · 대회위원장 책임","level":"중","rule":"16.A","stem":"대회위원장은 토너먼트 심판 및 관계자의 역할과 책임 범위를 지정한다.","options":["맞다","틀리다"],"answer":0,"explanation":"대회 전반에 대한 책임과 역할 배정이 대회위원장에게 있다."},{"id":"1-27","set":1,"number":27,"chapter":17,"topic":"제17장 · 심판 책임","level":"하","rule":"17.B.2","stem":"매치가 시작되기 전 심판의 점검 대상에는 네트 높이와 코트 마킹이 포함된다.","options":["맞다","틀리다"],"answer":0,"explanation":"심판은 코트의 청결 상태, 조명, 네트 높이, 코트 마킹과 위험요소를 점검한다."},{"id":"1-28","set":1,"number":28,"chapter":24,"topic":"제24장 · 심판 없는 토너먼트","level":"중","rule":"24.A","stem":"심판 없는 복식 토너먼트에서 두 게임 사이에 경기시작 서버를 바꿀 경우 다음 게임 전에 상대에게 알려야 한다.","options":["맞다","틀리다"],"answer":0,"explanation":"심판 없는 복식에서는 다음 게임 전에 상대에게 교체 사실을 통지한다."},{"id":"1-29","set":1,"number":29,"chapter":7,"topic":"제7장 · 서브","level":"중","rule":"7.C.4","stem":"발리 서브는 백핸드로도 할 수 있다.","options":["맞다","틀리다"],"answer":0,"explanation":"타격 동작의 제한을 충족하면 포핸드와 백핸드를 모두 사용할 수 있다."},{"id":"1-30","set":1,"number":30,"chapter":8,"topic":"제8장 · 라인 콜","level":"하","rule":"8.J","stem":"선수들은 라인 판정을 위해 관중의 의견을 참고할 수 있다.","options":["맞다","틀리다"],"answer":1,"explanation":"규정은 관중의 의견을 판정에 참고하지 않도록 한다."}]},{"id":2,"title":"제2회 모의고사","questions":[{"id":"2-1","set":2,"number":1,"chapter":8,"topic":"제8장 · 라인 콜","level":"중","rule":"8.F.4","stem":"볼이 공중에 있는 동안 복식 파트너가 “나갈 것 같아”라고 말한다. 이 말의 성격은?","options":["사이드 아웃 선언","파트너 간 의사소통","리플레이 콜","유효한 아웃 콜"],"answer":1,"explanation":"볼이 떨어지기 전에 아웃 가능성을 말한 것은 파트너끼리의 의사소통이다."},{"id":"2-2","set":2,"number":2,"chapter":13,"topic":"제13장 · 네트 및 네트 지지 시스템","level":"상","rule":"13.I.1, 13.G~H","stem":"볼이 완전히 자기 쪽에 넘어온 뒤 선수는 볼을 쳤다. 후속 동작으로 패들만 네트 평면을 넘었고, 네트와 상대 선수 및 상대 코트에는 닿지 않았다. 판정은?","options":["허용되는 후속 동작","상대 코트 안에 떨어져도 리플레이","패들이 평면을 넘는 순간 폴트","상대 선수의 폴트"],"answer":0,"explanation":"합법적인 타격 직후 같은 스트로크의 연속 동작으로 네트 평면을 넘을 수 있다."},{"id":"2-3","set":2,"number":3,"chapter":5,"topic":"제5장 · 선수 위치 및 서브 순서","level":"중","rule":"5.B.3","stem":"표준 복식에서 A팀 점수가 3점일 때, A팀 경기시작 서버의 올바른 리시브 위치는?","options":["리시브 팀은 같은 쪽에 둘 다 서야 함","상대 점수가 짝수일 때만 왼쪽","왼쪽","오른쪽"],"answer":2,"explanation":"경기시작 서버의 위치는 자신의 팀이 홀수 점수일 때 왼쪽이다."},{"id":"2-4","set":2,"number":4,"chapter":10,"topic":"제10장 · 랠리 상황","level":"중","rule":"10.D~10.D.2","stem":"다른 위반이 없을 때 허용되는 더블 히트는?","options":["한 선수가 한 방향으로 이어지는 한 스트로크에서 두 번 맞힘","한 선수가 스윙 방향을 반대로 바꿔 두 번 맞힘","복식 파트너가 한 번씩 맞힘","한 선수가 스윙을 멈추고 다시 쳐서 두 번 맞힘"],"answer":0,"explanation":"한 선수가 한 방향으로 연속적으로 스트로크하는 경우에만 볼이 패들에 두 번 닿을 수 있다."},{"id":"2-5","set":2,"number":5,"chapter":11,"topic":"제11장 · 논발리 존 위반","level":"상","rule":"11.A.1~2","stem":"논발리 존 밖에서 발리한 선수가 추진력을 제어하려다 존 안에 서 있는 자기 파트너와 부딪혔다. 판정은?","options":["파트너에게만 폴트","본인의 발이 존에 닿지 않아 유효","무조건 리플레이","발리한 선수의 폴트"],"answer":3,"explanation":"발리 추진력으로 존에 접촉 중인 사람이나 물체를 건드리는 경우도 발리 폴트다."},{"id":"2-6","set":2,"number":6,"chapter":20,"topic":"제20장 · 토너먼트 매치 상황","level":"상","rule":"20.E.1.c~20.E.2.h","stem":"심판 있는 토너먼트에서 심판이 발리 서브 타격 높이가 허리 위였는지 확신할 수 없다. 리시버가 아직 리턴하지 않았다면 가능한 판정은?","options":["상대에게 1점을 주고 같은 서버 유지","리플레이 선언","리시버 폴트 선언","확신이 없어도 서버 폴트 확정"],"answer":1,"explanation":"심판이 해당 서비스 요건의 충족 여부를 확신할 수 없을 때 리플레이를 선언할 수 있다."},{"id":"2-7","set":2,"number":7,"chapter":4,"topic":"제4장 · 득점","level":"중","rule":"제1장, 4.B, 15.C","stem":"2점 차 승리 조건의 11점 게임에서 10–10 이후 A가 한 점을 얻었다. 상황은?","options":["A가 11–10으로 앞서고 게임은 계속된다.","A가 목표 11점에 도달해 즉시 승리한다.","11–10은 성립할 수 없어 10–10으로 돌아간다.","다음 점수와 관계없이 엔드를 바꾼다."],"answer":0,"explanation":"목표 점수에 도달해도 2점 이상 앞서야 승리한다. A가 다음 점수도 얻으면 12–10으로 승리한다."},{"id":"2-8","set":2,"number":8,"chapter":18,"topic":"제18장 · 매치 전 선수 책임","level":"중","rule":"18.A.1","stem":"토너먼트 매치 시작 전 패들을 점검하던 중 승인 목록에 없는 패들을 발견했다. 어떻게 처리하는가?","options":["벌칙 없이 규격을 지키는 승인 패들로 교체한다.","선수의 선택에 따라 그대로 진행한다.","즉시 매치를 몰수한다.","이 패들로 첫 게임만 진행한다."],"answer":0,"explanation":"매치 시작 전이라면 적합한 패들로 교체하며, 교체 자체에 대한 벌칙은 없다."},{"id":"2-9","set":2,"number":9,"chapter":2,"topic":"제2장 · 정의","level":"하","rule":"제2장 정의","stem":"라이브 볼 상태가 시작되는 시점은?","options":["서브 첫 바운스","점수 공지 완료","점수 공지 시작","서브 타격"],"answer":2,"explanation":"라이브 볼은 점수 공지가 시작되면 시작한다. 볼 인 플레이와 랠리의 시작은 서브 타격이다."},{"id":"2-10","set":2,"number":10,"chapter":1,"topic":"제1장 · 게임","level":"하","rule":"제1장 기본원칙","stem":"피클볼의 공정한 플레이 원칙에 맞는 행동은?","options":["애매한 판정은 상대에게 유리하게 판단한다.","매치 포인트에서는 애매한 판정을 자기 팀에 유리하게 본다.","애매하면 먼저 콜한 팀이 유리하게 판단한다.","공이 애매하게 떨어지면 관중에게 결정권을 준다."],"answer":0,"explanation":"판정에 의심이 있으면 상대에게 유리하게 판단한다."},{"id":"2-11","set":2,"number":11,"chapter":25,"topic":"제25장 · 휠체어·어댑티브 스탠딩·하이브리드 복식","level":"상","rule":"25.B.3.a","stem":"자격이 있는 어댑티브 스탠딩 선수가 해당 종목에서 더블 바운스 옵션을 쓰려 한다. 바른 절차는?","options":["세 번째 바운스가 발생한 뒤 사후 신고","매치 시작 전에 신고하고 그 매치 전체에 적용","뒤지고 있을 때 랠리 중 신고","첫 번째 게임만 자동으로 적용"],"answer":1,"explanation":"더블 바운스 허용 자격을 갖춘 선수는 매치 시작 전에 신고하고 매치 전체에 적용한다."},{"id":"2-12","set":2,"number":12,"chapter":14,"topic":"제14장 · 표준 피클볼 변형","level":"중","rule":"14.B.1.c","stem":"미니싱글즈를 위해 논발리 존에 추가로 필요한 라인은?","options":["베이스라인을 뒤로 2피트(24인치) 옮긴 라인","사이드라인 바깥에 그리는 두 번째 사이드라인","기존 센터라인을 논발리 존을 가로질러 연장하는 라인","네트와 평행하게 경기장 표면을 구분하는 라인"],"answer":2,"explanation":"센터라인을 각각 논발리 존을 가로지르게 연장한다. 추가 라인의 색은 기존 라인과 달라도 된다."},{"id":"2-13","set":2,"number":13,"chapter":7,"topic":"제7장 · 서브","level":"하","rule":"7.B.1","stem":"규정이 허용하는 서브용 볼 놓기 방법은?","options":["파트너가 대신 놓기","라켓이 아닌 보조 기구로 떠받쳐 놓기","양손으로 동시에 놓기","한 손 또는 패들로 놓기"],"answer":3,"explanation":"서버는 한 손이나 패들을 사용해 볼을 놓아야 한다."},{"id":"2-14","set":2,"number":14,"chapter":15,"topic":"제15장 · 토너먼트 종목 및 점수 옵션","level":"중","rule":"15.B.4.b","stem":"순위 산정 대상 두 팀의 매치 승수가 같다. 첫 번째 타이브레이커는?","options":["두 팀의 총 득점","두 팀의 맞대결 매치 기록","두 팀의 모든 게임 득실점차","코인 토스"],"answer":1,"explanation":"첫 타이브레이커는 동률 팀끼리 치른 맞대결 매치 기록이다."},{"id":"2-15","set":2,"number":15,"chapter":9,"topic":"제9장 · 데드볼·폴트·방해요소","level":"중","rule":"9.B.3.b","stem":"심판 없는 일반 경기에서 상대의 논발리 존 폴트를 즉시 콜했으나 양 팀 의견이 다르다. 처리 방법은?","options":["동전 던지기로 결정","해당 랠리 리플레이","먼저 외친 팀이 랠리 승리","서브 팀에게 득점 부여"],"answer":1,"explanation":"상대 폴트 콜에 대해 두 팀이 이견을 보이면 랠리를 다시 한다."},{"id":"2-16","set":2,"number":16,"chapter":3,"topic":"제3장 · 코트 및 장비","level":"하","rule":"3.A.3","stem":"경기장 표면에 요구되는 최소 폭과 길이는?","options":["34피트(408인치) × 64피트(768인치)","20피트(240인치) × 44피트(528인치)","50피트(600인치) × 80피트(960인치)","30피트(360인치) × 60피트(720인치)"],"answer":3,"explanation":"코트 주변 플레이 공간까지 포함한 최소 경기장 표면은 30피트(360인치) × 60피트(720인치)다."},{"id":"2-17","set":2,"number":17,"chapter":21,"topic":"제21장 · 타임아웃과 휴식","level":"중","rule":"21.B.2","stem":"토너먼트의 15점 단일 게임 매치에서 한 팀이 몇 점에 먼저 도달하면 엔드를 바꾸는가?","options":["7점","6점","8점","11점"],"answer":2,"explanation":"15점 단일 게임 또는 타이브레이커 게임에서 8점 선도 시 엔드를 바꾼다."},{"id":"2-18","set":2,"number":18,"chapter":6,"topic":"제6장 · 선수 준비 상태와 점수 공지","level":"하","rule":"6.A.1","stem":"점수 공지 전 규정된 준비 안 됨 신호는?","options":["발을 세 번 구른다.","볼을 네트 쪽에 굴린다.","패들을 허리 옆에 둔다.","패들을 머리 위로 들어 올린다."],"answer":3,"explanation":"패들이나 빈손을 머리 위로 올리거나, 네트를 향해 완전히 등을 돌릴 수 있다."},{"id":"2-19","set":2,"number":19,"chapter":19,"topic":"제19장 · 토너먼트 라인 콜","level":"상","rule":"19.F.1","stem":"토너먼트에서 선수가 랠리를 끝내는 샷에 아웃을 콜했다. 이의 제기 후 심판은 볼이 인이었음을 분명히 확인해 콜을 번복했다. 판정은?","options":["무조건 랠리 리플레이","선수의 아웃 콜 유지","아웃을 콜한 선수나 팀의 폴트","볼을 친 쪽의 폴트"],"answer":2,"explanation":"선수의 아웃 콜을 심판이 번복하면 그 콜을 한 선수나 팀에 폴트를 선언한다."},{"id":"2-20","set":2,"number":20,"chapter":22,"topic":"제22장 · 비신사적인 행위 및 페널티","level":"상","rule":"22.H","stem":"15점 게임에서 한 팀은 7점을 얻은 상태였으나 그 게임을 몰수당했다. 몰수팀 점수를 뒤에 적을 때 게임 기록은?","options":["15–7","7–0","9–7","15–0"],"answer":3,"explanation":"몰수된 게임에서는 몰수팀 점수를 0으로 기록한다. 먼저 완료된 게임 점수는 유지한다."},{"id":"2-21","set":2,"number":21,"chapter":7,"topic":"제7장 · 서브","level":"중","rule":"7.D.3","stem":"다른 요건과 제한 시간을 지켰다면, 드롭 서브의 볼이 타격 전에 두 번 바운스해도 된다.","options":["맞다","틀리다"],"answer":0,"explanation":"드롭 서브 준비 단계에서 타격 전 바운스 횟수에는 제한이 없다."},{"id":"2-22","set":2,"number":22,"chapter":23,"topic":"제23장 · 기권 및 취소","level":"하","rule":"23.A.1","stem":"진행 중인 토너먼트 매치에서 선수나 팀은 심판에게 알려 기권할 수 있다.","options":["맞다","틀리다"],"answer":0,"explanation":"진행 중인 매치의 기권은 심판에게 통보한다."},{"id":"2-23","set":2,"number":23,"chapter":16,"topic":"제16장 · 대회위원장 책임","level":"하","rule":"16.B","stem":"대회위원장이 일부 운영 업무를 대리인에게 맡기면 최종 결정권도 반드시 대리인에게 넘어간다.","options":["맞다","틀리다"],"answer":1,"explanation":"일부 업무는 위임할 수 있지만 토너먼트의 최종 결정권은 대회위원장에게 있다."},{"id":"2-24","set":2,"number":24,"chapter":10,"topic":"제10장 · 랠리 상황","level":"중","rule":"10.B","stem":"일반 스탠딩 플레이 중 볼이 자기 코트에서 두 번 바운스한 뒤에 리턴해도 유효하다.","options":["맞다","틀리다"],"answer":1,"explanation":"일반 스탠딩 선수는 두 번째 바운스가 일어나기 전에 리턴해야 한다."},{"id":"2-25","set":2,"number":25,"chapter":12,"topic":"제12장 · 플레이 중 패들","level":"중","rule":"12.B.1","stem":"선수가 패들을 던져 공에 맞혀 리턴하면 합법이다.","options":["맞다","틀리다"],"answer":1,"explanation":"공을 타격하는 순간 패들을 소지하고 있어야 한다."},{"id":"2-26","set":2,"number":26,"chapter":17,"topic":"제17장 · 심판 책임","level":"중","rule":"17.C.2","stem":"승인된 규칙 수정 사항이나 코트의 비정상적인 안전 조건은 매치 전 심판 브리핑 대상이다.","options":["맞다","틀리다"],"answer":0,"explanation":"심판은 승인된 수정 사항과 잠재적 안전 문제를 경기 전에 선수에게 알려야 한다."},{"id":"2-27","set":2,"number":27,"chapter":6,"topic":"제6장 · 선수 준비 상태와 점수 공지","level":"하","rule":"6.B.1","stem":"표준 단식의 점수 콜에는 서버 번호가 포함된다.","options":["맞다","틀리다"],"answer":1,"explanation":"단식은 서버 점수, 리시버 점수 순서로 두 숫자만 부른다."},{"id":"2-28","set":2,"number":28,"chapter":8,"topic":"제8장 · 라인 콜","level":"중","rule":"8.F","stem":"아웃 콜은 목소리 없이 수신호만으로 할 수 있다.","options":["맞다","틀리다"],"answer":0,"explanation":"신속한 음성 콜, 수신호, 두 가지 병행이 모두 가능하다."},{"id":"2-29","set":2,"number":29,"chapter":26,"topic":"부록 A · 폴트 및 리플레이","level":"상","rule":"부록 A.2 · 13.A.1","stem":"리턴 볼이 네트를 넘은 뒤 내려 늘어진 네트 부분에 걸린 경우는 부록 A의 리플레이 상황에 해당한다.","options":["맞다","틀리다"],"answer":0,"explanation":"네트를 넘은 리턴이 걸리거나 바닥에 드리워진 네트 부분에 접촉하면 해당 랠리를 다시 한다."},{"id":"2-30","set":2,"number":30,"chapter":24,"topic":"제24장 · 심판 없는 토너먼트","level":"중","rule":"24.B.1","stem":"심판 없는 토너먼트의 랠리 중 추가 볼이 상대에게 보여도 바닥에만 떨어지지 않으면 폴트가 아니다.","options":["맞다","틀리다"],"answer":1,"explanation":"추가 볼이 상대에게 보이거나 경기장 표면에 떨어지는 두 경우 모두 폴트다."}]},{"id":3,"title":"제3회 모의고사","questions":[{"id":"3-1","set":3,"number":1,"chapter":15,"topic":"제15장 · 토너먼트 종목 및 점수 옵션","level":"중","rule":"15.C.2","stem":"토너먼트에서 대회위원장이 잠정 랠리 스코어링을 선택할 수 없는 종목은?","options":["리그전 방식의 단식","이중 탈락 방식의 복식","11점 단일 게임 매치","21점 단일 게임 매치"],"answer":1,"explanation":"잠정 랠리 스코어링 사용 권한에서 이중 탈락 복식은 명시적으로 제외된다."},{"id":"3-2","set":3,"number":2,"chapter":13,"topic":"제13장 · 네트 및 네트 지지 시스템","level":"중","rule":"13.B.1","stem":"서브가 네트를 지나 상대 서비스 코트에 떨어지기 전에 네트 지지 시스템의 크로스바에 맞았다. 판정은?","options":["무조건 리플레이","리시버 폴트","서브 네트 인으로 인정","서버 폴트"],"answer":3,"explanation":"서브 볼은 어느 쪽이든 네트 지지 시스템에 닿으면 폴트다."},{"id":"3-3","set":3,"number":3,"chapter":9,"topic":"제9장 · 데드볼·폴트·방해요소","level":"중","rule":"9.B.4","stem":"심판 없는 일반 경기에서 상대의 캐리를 발견했다. 상대 논발리 존 폴트나 서브 풋 폴트는 아니다. 어떻게 처리하는가?","options":["다음 게임에서 점수를 1점 차감한다.","발견한 쪽이 자동으로 랠리를 이긴다.","랠리가 끝난 뒤 상대에게 언급할 수 있고, 최종 결정은 해당 선수가 한다.","즉시 상대에게 폴트를 집행한다."],"answer":2,"explanation":"상대 캐리는 라인 콜이나 직접 콜 가능한 상대의 두 가지 폴트에 속하지 않는다."},{"id":"3-4","set":3,"number":4,"chapter":20,"topic":"제20장 · 토너먼트 매치 상황","level":"중","rule":"20.B","stem":"심판 있는 매치에서 서브 전에 선수가 심판에게 확인을 요청할 수 있는 것은?","options":["올바른 서버·리시버와 선수 위치","선심의 다음 인·아웃 콜","상대 팀의 다음 타구 전략","상대가 사용할 다음 타임아웃 시간"],"answer":0,"explanation":"선수는 서브 전에 심판에게 올바른 서버, 리시버 및 위치를 확인해 달라고 요청할 수 있다."},{"id":"3-5","set":3,"number":5,"chapter":22,"topic":"제22장 · 비신사적인 행위 및 페널티","level":"중","rule":"22.C.1~2","stem":"경기 중 한 팀에 테크니컬 경고만 1회 부과됐다. 그 경고 자체의 영향은?","options":["점수와 서버는 그대로다.","경고를 받은 팀의 점수에서 1점을 뺀다.","경고만으로 그 팀의 게임을 몰수한다.","상대 팀에 서브권이 넘어간다."],"answer":0,"explanation":"구두 경고와 테크니컬 경고 자체로 점수가 조정되거나 서버가 변경되지는 않는다."},{"id":"3-6","set":3,"number":6,"chapter":25,"topic":"제25장 · 휠체어·어댑티브 스탠딩·하이브리드 복식","level":"상","rule":"25.A.8.a","stem":"휠체어 선수의 서브 타격 순간, 큰 뒷바퀴 하나만 올바른 서브 구역 바닥에 닿고 다른 큰 뒷바퀴는 들려 있다. 판정은?","options":["발리 서브에서만 유효","작은 앞바퀴가 닿아 있다면 유효","큰 뒷바퀴 하나만 닿으면 유효","서버 폴트"],"answer":3,"explanation":"휠체어 서버는 타격 순간 두 큰 뒷바퀴 모두 경기장 표면에 접촉해야 한다."},{"id":"3-7","set":3,"number":7,"chapter":11,"topic":"제11장 · 논발리 존 위반","level":"중","rule":"11.A.1, 3.A.4.c","stem":"발리하는 순간 선수의 신발이 논발리 존 라인에 닿았지만 발이 선 안쪽까지 들어가지는 않았다. 판정은?","options":["항상 리플레이","발이 선 안으로 들어가지 않았으므로 유효","발리 폴트","발리 높이가 네트보다 높으면 유효"],"answer":2,"explanation":"라인 자체가 논발리 존에 속하므로 발리 중 라인에 닿으면 폴트다."},{"id":"3-8","set":3,"number":8,"chapter":21,"topic":"제21장 · 타임아웃과 휴식","level":"하","rule":"21.C.3","stem":"토너먼트에서 한 선수가 한 매치에 사용할 수 있는 메디컬 타임아웃은?","options":["2회","3회","1회","게임당 1회"],"answer":2,"explanation":"메디컬 타임아웃 횟수는 선수별로 매치당 1회다."},{"id":"3-9","set":3,"number":9,"chapter":4,"topic":"제4장 · 득점","level":"중","rule":"4.A, 5.A.2~3","stem":"표준 단식에서 A는 서브권으로 첫 랠리를 이겼다. 이어 두 번째 랠리는 리시버 B가 이겼다. 두 랠리에서 얻은 점수는?","options":["A 0점, B 1점","A 1점, B 1점","A 2점, B 0점","A 1점, B 0점"],"answer":3,"explanation":"A는 서버로 이긴 첫 랠리에서만 득점한다. 두 번째 랠리에서 이긴 B는 서브권만 받는다."},{"id":"3-10","set":3,"number":10,"chapter":10,"topic":"제10장 · 랠리 상황","level":"중","rule":"10.A.2","stem":"리시버가 정상적으로 바운스 후 서브를 리턴했다. 그 리턴을 서버의 파트너가 바운스 전에 쳤다. 판정은?","options":["유효한 세 번째 타구","리시브 팀 폴트","랠리 리플레이","서빙 팀 폴트"],"answer":3,"explanation":"서빙 팀도 첫 리턴을 바운스시킨 후에 쳐야 한다."},{"id":"3-11","set":3,"number":11,"chapter":7,"topic":"제7장 · 서브","level":"중","rule":"7.C.2~3, 7.C.5","stem":"발리 서브에서 패들은 상향으로 움직였고 볼도 허리 아래였다. 그러나 타격 순간 패들 헤드 최고점이 손목 관절 최고점보다 분명히 높았다. 판정은?","options":["상대가 받을 때까지 판정 보류","서버 폴트","볼이 허리 아래이므로 유효","볼이 인이면 유효"],"answer":1,"explanation":"패들 헤드 높이, 볼 높이, 상향 동작은 각각 충족해야 한다."},{"id":"3-12","set":3,"number":12,"chapter":19,"topic":"제19장 · 토너먼트 라인 콜","level":"상","rule":"19.F.2","stem":"선심의 아웃 콜을 심판이 인으로 번복했다. 수혜 팀은 상대에게 랠리를 양보하지 않았다. 처리 방법은?","options":["랠리 리플레이","수혜 팀에 자동으로 1점","선심의 아웃 콜 유지","아웃을 콜한 선심 측 선수에게 폴트"],"answer":0,"explanation":"선심의 콜이 번복되면 보통 리플레이한다. 수혜 팀이 랠리를 양보했다면 예외다."},{"id":"3-13","set":3,"number":13,"chapter":14,"topic":"제14장 · 표준 피클볼 변형","level":"중","rule":"14.A.3","stem":"잠정 랠리 스코어링을 적용한 복식에서 서브 팀 7점, 리시브 팀 5점이다. 점수를 어떻게 부르는가?","options":["7–5–1","7–5","5–7","5–7–2"],"answer":1,"explanation":"잠정 랠리 스코어링에서는 서브 팀 점수와 리시브 팀 점수만 순서대로 부른다."},{"id":"3-14","set":3,"number":14,"chapter":3,"topic":"제3장 · 코트 및 장비","level":"하","rule":"3.A.4.e","stem":"표준 코트 라인의 폭은?","options":["2인치","4인치","3인치","1인치"],"answer":0,"explanation":"코트의 모든 라인은 2인치 폭이며, 같은 색으로 경기장 표면과 뚜렷이 대비되어야 한다."},{"id":"3-15","set":3,"number":15,"chapter":8,"topic":"제8장 · 라인 콜","level":"상","rule":"8.B~C, 3.A.4.f","stem":"서브가 논발리 존 라인을 넘어 대각선 방향의 올바른 서비스 코트 베이스라인에 처음 닿았다. 판정은?","options":["인","아웃","서버 폴트이지만 리플레이","네트에 닿았는지 확인해야 판정 가능"],"answer":0,"explanation":"서비스 코트는 해당 베이스라인을 포함한다. 서브에서 제외되는 논발리 존 라인과 구분한다."},{"id":"3-16","set":3,"number":16,"chapter":18,"topic":"제18장 · 매치 전 선수 책임","level":"하","rule":"18.C","stem":"토너먼트 복식의 경기시작 서버가 해야 하는 일은?","options":["경기 기록지에 매 랠리 서명한다.","파트너와 같은 색 패들을 사용한다.","두 선수의 이름을 서브마다 말한다.","대회위원장이 정한 식별 표시를 잘 보이게 착용한다."],"answer":3,"explanation":"경기시작 서버의 표시는 선수들과 심판진이 플레이 중 쉽게 볼 수 있어야 한다."},{"id":"3-17","set":3,"number":17,"chapter":5,"topic":"제5장 · 선수 위치 및 서브 순서","level":"중","rule":"5.A.2~3, 4.A","stem":"표준 단식에서 4점인 서버가 랠리를 이겼다. 다음 상황은?","options":["상대가 다음 서브","서버가 5점으로 오른쪽에서 서브","서버가 5점으로 왼쪽에서 서브","서버가 4점으로 왼쪽에서 서브"],"answer":2,"explanation":"득점하면 같은 서버가 서브 구역을 바꾼다. 5점은 홀수이므로 왼쪽이다."},{"id":"3-18","set":3,"number":18,"chapter":2,"topic":"제2장 · 정의","level":"하","rule":"제2장 정의","stem":"볼 인 플레이 상태의 시작 시점은?","options":["점수 공지를 시작한 순간","서브를 타격한 순간","리시버 쪽 첫 바운스","선수가 준비 신호를 한 순간"],"answer":1,"explanation":"볼 인 플레이는 서브 타격부터 데드볼까지다. 라이브 볼의 시작은 점수 공지 시작이다."},{"id":"3-19","set":3,"number":19,"chapter":1,"topic":"제1장 · 게임","level":"하","rule":"제1장 기본원칙","stem":"규정집이 제시하는 판정 시점의 기본원칙은?","options":["랠리가 길어질수록 콜을 나중으로 미룬다.","유리한 시점까지 기다렸다가 콜한다.","판정은 즉시 신속하게 한다.","모든 판정은 게임을 마친 뒤 모아서 한다."],"answer":2,"explanation":"신속한 콜은 유리한 판정을 위해 고의로 결정을 늦추는 일을 막는 기본 원칙이다."},{"id":"3-20","set":3,"number":20,"chapter":6,"topic":"제6장 · 선수 준비 상태와 점수 공지","level":"상","rule":"6.F.4","stem":"잘못된 점수 콜을 아무도 지적하지 않은 채 랠리가 끝났다. 어떻게 처리하는가?","options":["이전 점수 콜을 유지하고 다음 랠리를 시작한다.","랠리 결과를 인정하고 다음 서브 전에 점수를 정정한다.","점수를 잘못 부른 선수가 자동 실점한다.","끝난 랠리를 다시 한다."],"answer":1,"explanation":"완료된 랠리의 결과에는 영향을 주지 않고, 다음 서브 전에 정확한 점수로 고친다."},{"id":"3-21","set":3,"number":21,"chapter":23,"topic":"제23장 · 기권 및 취소","level":"상","rule":"23.A.3","stem":"한 매치를 기권하면 종목 형식과 관계없이 그 대진의 모든 잔여 경기에 출전할 수 없다.","options":["맞다","틀리다"],"answer":1,"explanation":"매치 기권 후에도 종목 형식상 자격이 있다면 같은 대진에서 계속 플레이할 수 있다."},{"id":"3-22","set":3,"number":22,"chapter":16,"topic":"제16장 · 대회위원장 책임","level":"중","rule":"16.G","stem":"대회위원장은 토너먼트 볼을 공식 승인 볼 목록에서 선택한다.","options":["맞다","틀리다"],"answer":0,"explanation":"규정은 USA Pickleball 웹사이트에 게시된 공식 승인 목록에서 토너먼트 볼을 고르도록 한다."},{"id":"3-23","set":3,"number":23,"chapter":7,"topic":"제7장 · 서브","level":"중","rule":"7.E.4","stem":"서브 볼이 바운스 전에 서버의 파트너에게 맞으면 무조건 리플레이한다.","options":["맞다","틀리다"],"answer":1,"explanation":"서버 또는 서버 파트너에게 바운스 전 접촉했다면 서버 폴트다."},{"id":"3-24","set":3,"number":24,"chapter":3,"topic":"제3장 · 코트 및 장비","level":"하","rule":"3.A.4.a","stem":"베이스라인은 네트와 평행하다.","options":["맞다","틀리다"],"answer":0,"explanation":"베이스라인은 코트 양쪽 엔드에서 네트와 평행하게 놓인다."},{"id":"3-25","set":3,"number":25,"chapter":14,"topic":"제14장 · 표준 피클볼 변형","level":"중","rule":"14.B.1.a","stem":"미니싱글즈에서는 양쪽 선수 모두에게 자기 쪽 코트의 전체 폭이 매 랠리에서 인이다.","options":["맞다","틀리다"],"answer":1,"explanation":"개인 점수에 따라 각자의 오른쪽 또는 왼쪽 한쪽 절반만 사용한다."},{"id":"3-26","set":3,"number":26,"chapter":17,"topic":"제17장 · 심판 책임","level":"중","rule":"17.C.4","stem":"공정한 추첨 후 한 팀이 시작할 코트 엔드를 선택했다. 첫 서브 전에 그 팀은 이미 한 선택을 자유롭게 바꿀 수 있다.","options":["맞다","틀리다"],"answer":1,"explanation":"공정한 방식으로 선택권을 정하고, 선택을 한 뒤에는 변경할 수 없다."},{"id":"3-27","set":3,"number":27,"chapter":21,"topic":"제21장 · 타임아웃과 휴식","level":"상","rule":"21.B.4","stem":"엔드체인지 타임아웃 후에는 서브권이 상대에게 넘어간다.","options":["맞다","틀리다"],"answer":1,"explanation":"경기 중 엔드체인지 타임아웃 뒤에는 같은 서버로 계속한다."},{"id":"3-28","set":3,"number":28,"chapter":26,"topic":"부록 A · 폴트 및 리플레이","level":"상","rule":"부록 A.2 · 19.G.4","stem":"선심이 있는 대회의 마지막 랠리 타구를 선심과 심판 모두 판정할 수 없으면 해당 랠리를 리플레이한다.","options":["맞다","틀리다"],"answer":0,"explanation":"심판진 모두 라인 콜을 할 수 없는 경우에는 해당 랠리를 리플레이한다."},{"id":"3-29","set":3,"number":29,"chapter":12,"topic":"제12장 · 플레이 중 패들","level":"하","rule":"12.B","stem":"다른 규정 위반이 없다면 선수는 두 손으로 패들 한 개를 잡고 볼을 칠 수 있다.","options":["맞다","틀리다"],"answer":0,"explanation":"규정은 패들을 한 손 또는 두 손으로 잡는 것을 허용한다."},{"id":"3-30","set":3,"number":30,"chapter":24,"topic":"제24장 · 심판 없는 토너먼트","level":"중","rule":"24.C.2","stem":"심판 없는 토너먼트에서 선수들끼리 빠르게 해결할 수 없는 판정 문제가 생기면 심판 또는 대회위원장을 요청할 수 있다.","options":["맞다","틀리다"],"answer":0,"explanation":"선수끼리 쉽게 해결되지 않을 때는 심판이나 대회위원장의 개입을 요청할 수 있다."}]},{"id":4,"title":"제4회 모의고사","questions":[{"id":"4-1","set":4,"number":1,"chapter":10,"topic":"제10장 · 랠리 상황","level":"중","rule":"10.C.4","stem":"랠리 중 타구가 코트에 떨어지기 전에 천장에 맞았다. 누구의 폴트인가?","options":["심판","볼을 받아야 했던 선수","볼을 친 선수","누구의 폴트도 아니며 무조건 리플레이"],"answer":2,"explanation":"천장은 영구물체다. 코트 안에 바운스하기 전에 영구물체에 맞히면 타구자 폴트다."},{"id":"4-2","set":4,"number":2,"chapter":6,"topic":"제6장 · 선수 준비 상태와 점수 공지","level":"중","rule":"6.B.2.a","stem":"표준 복식에서 서버가 점수를 공지할 수 없어서 파트너가 대신했다. 이후 점수 콜은 어떻게 하는가?","options":["목소리 손상 예외가 없으면 같은 파트너가 그 게임 끝까지 공지한다.","서브할 때마다 두 사람이 번갈아 공지한다.","그 게임에서는 점수 공지를 생략한다.","한 번 대리 공지하면 상대 팀이 계속 공지한다."],"answer":0,"explanation":"대신 콜한 파트너가 그 게임이 끝날 때까지 계속 부르며, 그 선수의 목소리가 손상되면 예외다."},{"id":"4-3","set":4,"number":3,"chapter":4,"topic":"제4장 · 득점","level":"중","rule":"4.A","stem":"표준 득점 복식에서 리시브 팀이 서브를 받아 상대의 폴트로 랠리를 따냈다. 이 랠리에서 점수를 얻는 팀은?","options":["서브 팀만 1점 얻는다.","어느 팀도 득점하지 않는다.","리시브 팀만 1점 얻는다.","두 팀이 1점씩 얻는다."],"answer":1,"explanation":"표준 득점에서는 서브 팀이 랠리를 이겨야 점수를 얻는다. 이 상황에서는 랠리가 끝나도 점수는 그대로다."},{"id":"4-4","set":4,"number":4,"chapter":14,"topic":"제14장 · 표준 피클볼 변형","level":"상","rule":"14.B.1.a~b","stem":"미니싱글즈에서 상대 코트의 오른쪽 절반만 인 플레이 영역인 랠리다. 네트를 넘긴 리턴이 상대 코트의 왼쪽 절반에 떨어졌다. 판정은?","options":["표준 코트 외곽선 안이므로 인","아웃","공이 한 번 바운스하면 자동 리플레이","공을 친 선수가 인·아웃을 선택"],"answer":1,"explanation":"미니싱글즈에서는 각 선수 쪽의 지정된 절반만 해당 랠리의 인 플레이 영역이다."},{"id":"4-5","set":4,"number":5,"chapter":21,"topic":"제21장 · 타임아웃과 휴식","level":"상","rule":"21.C.4","stem":"의료진을 호출했지만 도착 전에 선수가 메디컬 타임아웃을 취소했다. 표준 타임아웃이 1회 남아 있다면?","options":["표준 타임아웃 1회만 차감","둘 다 유지하고 테크니컬 파울 부과","두 타임아웃을 모두 차감","메디컬 타임아웃 1회만 차감"],"answer":0,"explanation":"의료진이 오기 전 취소하면 표준 타임아웃 1회를 차감하며 메디컬 타임아웃은 차감하지 않는다."},{"id":"4-6","set":4,"number":6,"chapter":25,"topic":"제25장 · 휠체어·어댑티브 스탠딩·하이브리드 복식","level":"중","rule":"25.A.9.a","stem":"휠체어 선수가 리턴하기 전 공이 자기 쪽에서 이미 세 번째 바운스를 했다. 판정은?","options":["휠체어 선수는 제한 없이 바운스 후 칠 수 있음","일반 스탠딩 선수의 폴트","휠체어 선수의 폴트","세 번째 바운스 때마다 리플레이"],"answer":2,"explanation":"휠체어 선수에게는 두 번까지 바운스를 허용하므로 세 번째 바운스 전에 리턴해야 한다."},{"id":"4-7","set":4,"number":7,"chapter":15,"topic":"제15장 · 토너먼트 종목 및 점수 옵션","level":"상","rule":"15.B.4.c","stem":"같은 조 리그전에서 두 팀이 매치 승수와 맞대결 기준으로도 동률이다. 다음 기준은?","options":["리그전 전체 총 득점","추가 매치의 동전 던지기","마지막 게임의 승리 점수","리그전 전체 게임의 득실점 차"],"answer":3,"explanation":"두 번째 타이브레이커는 해당 리그전에서 치른 모든 게임의 득실점 차다."},{"id":"4-8","set":4,"number":8,"chapter":13,"topic":"제13장 · 네트 및 네트 지지 시스템","level":"상","rule":"13.I.2","stem":"볼이 선수 코트 안에서 바운스한 뒤 강한 회전으로 상대 편으로 되돌아갔다. 선수가 네트 평면 너머로 손을 내밀어 칠 수 있는 조건은?","options":["볼이 자기 쪽에서 바운스하자마자 평면을 넘어도 된다.","볼이 상대 코트에서 한 번 바운스한 뒤에만 친다.","볼이 완전히 상대 쪽으로 되돌아간 뒤, 상대 코트에서 바운스하기 전에 친다.","옆 포스트로 돌아간 경우에만 상대 쪽에서 칠 수 있다."],"answer":2,"explanation":"되돌아가는 볼이 완전히 네트 평면을 넘은 뒤에 선수가 넘어갈 수 있으며, 상대 쪽에서 바운스하기 전에 볼을 쳐야 한다."},{"id":"4-9","set":4,"number":9,"chapter":5,"topic":"제5장 · 선수 위치 및 서브 순서","level":"중","rule":"5.B.6","stem":"표준 복식에서 서버 번호가 2인 팀이 서브 후 랠리에 패했다. 다음 진행은?","options":["같은 서버가 위치만 바꾼다.","점수나 서브에는 변화가 없다.","같은 팀 번호 1에게 서브권을 돌려준다.","사이드 아웃으로 상대 팀에 서브권을 넘긴다."],"answer":3,"explanation":"두 번째 서버가 랠리를 잃으면 그 팀의 서브 로테이션이 끝난다."},{"id":"4-10","set":4,"number":10,"chapter":19,"topic":"제19장 · 토너먼트 라인 콜","level":"중","rule":"19.B","stem":"심판은 있지만 선심이 없는 매치에서 선수에게 아웃 콜 책임이 있는 라인은?","options":["상대 쪽의 모든 라인","자기 쪽 베이스라인·사이드라인·서비스 센터라인","네트와 양쪽 논발리 존 라인만","자기 쪽 논발리 존 라인만"],"answer":1,"explanation":"선심이 없으면 선수는 자기 쪽 베이스라인, 사이드라인과 서비스 센터라인에 대해 아웃 콜을 한다."},{"id":"4-11","set":4,"number":11,"chapter":20,"topic":"제20장 · 토너먼트 매치 상황","level":"상","rule":"20.F.1","stem":"심판 있는 토너먼트에서 볼이 깨졌고, 심판이 그 손상이 직전 랠리 결과에 영향을 줬다고 확인했다. 어떻게 하는가?","options":["볼만 교체하고 랠리 결과는 유지한다.","손상된 볼로 마지막 타구만 다시 한다.","직전 랠리 패자에게 1점을 주고 계속한다.","볼을 교체하고 해당 랠리를 다시 한다."],"answer":3,"explanation":"심판이 파손이 결과에 영향을 주었다고 판단하면 교체한 볼로 랠리를 리플레이한다."},{"id":"4-12","set":4,"number":12,"chapter":22,"topic":"제22장 · 비신사적인 행위 및 페널티","level":"상","rule":"22.E.1~2","stem":"A가 5점, B가 3점인 상태에서 A에 테크니컬 파울이 부과됐다. 이 파울만으로 일어나는 변화는?","options":["A의 점수가 4점으로 줄고 서브권이 자동 이전된다.","A의 점수가 4점으로 줄고 서버는 그대로다.","양쪽 점수는 그대로이고 서버만 바뀐다.","B의 점수가 4점으로 늘고 서버가 바뀐다."],"answer":1,"explanation":"위반팀에 점수가 있으면 그 팀에서 1점을 빼고, 파울 자체로는 서버를 변경하지 않는다."},{"id":"4-13","set":4,"number":13,"chapter":3,"topic":"제3장 · 코트 및 장비","level":"하","rule":"3.A.4.c","stem":"네트에서 한쪽 논발리 존 라인까지의 거리는?","options":["15피트(180인치)","7피트(84인치)","5피트(60인치)","10피트(120인치)"],"answer":1,"explanation":"양쪽 논발리 존은 각각 네트에서 7피트(84인치) 떨어진 라인까지 이어진다."},{"id":"4-14","set":4,"number":14,"chapter":7,"topic":"제7장 · 서브","level":"중","rule":"7.D.4, 7.A","stem":"드롭 서브의 볼이 베이스라인 안쪽 경기장 표면에 먼저 바운스했다. 서버의 발 위치와 다른 서브 요건은 충족했다. 바운스 위치만 놓고 본 판정은?","options":["허용된다.","두 발이 모두 코트 안에 있어야 허용된다.","서버 폴트다.","한 번만 경고한다."],"answer":0,"explanation":"타격 전 드롭 서브의 바운스 지점은 경기장 표면 안에서 제한하지 않는다. 타격 순간 서버 발 조건은 그대로 적용된다."},{"id":"4-15","set":4,"number":15,"chapter":9,"topic":"제9장 · 데드볼·폴트·방해요소","level":"하","rule":"9.B.3","stem":"일반 경기에서 상대에게 직접 콜할 수 있는 폴트 두 가지는?","options":["논발리 존 폴트와 서브 풋 폴트","더블 바운스와 위험한 복장","더블 히트와 캐리","캐리와 장비 이상"],"answer":0,"explanation":"상대의 폴트를 직접 콜할 수 있는 유형은 논발리 존 위반과 서브 풋 폴트다."},{"id":"4-16","set":4,"number":16,"chapter":2,"topic":"제2장 · 정의","level":"중","rule":"제2장 정의","stem":"타격이 끝났지만 발리한 선수가 관성으로 앞으로 이동 중이다. 추진력이 종료된 것으로 보는 때는?","options":["상대가 볼에 손을 대는 즉시","발리 후 지정된 2초가 지났을 때","균형과 움직임에 대한 통제를 완전히 회복하거나 논발리 존 쪽으로의 이동을 완전히 멈췄을 때","패들에서 볼이 떨어지는 즉시"],"answer":2,"explanation":"추진력은 공이 패들에서 떨어진 시점과 별개로, 선수의 균형과 움직임이 안정되거나 존 쪽 이동이 멈출 때까지 이어질 수 있다."},{"id":"4-17","set":4,"number":17,"chapter":8,"topic":"제8장 · 라인 콜","level":"상","rule":"8.F.3","stem":"선수가 자기 쪽에 떨어진 볼을 리턴하지 않았다. 볼이 데드가 된 직후 지체 없이 아웃 콜을 했다. 타이밍상 유효한가?","options":["유효하다.","데드볼 뒤라서 언제나 무효다.","리턴을 하지 않았으므로 리플레이만 가능하다.","관중이 동의해야 유효하다."],"answer":0,"explanation":"볼을 리턴하지 않았다면 데드볼 이후라도 지체 없이 한 아웃 콜은 인정된다."},{"id":"4-18","set":4,"number":18,"chapter":18,"topic":"제18장 · 매치 전 선수 책임","level":"하","rule":"18.B.2","stem":"토너먼트용 신발의 밑창 조건은?","options":["볼 색과 반드시 같다.","실외 경기에서만 밑창 조건이 적용된다.","경기장 표면에 자국이나 손상을 남기지 않는다.","항상 검은색이어야 한다."],"answer":2,"explanation":"신발 밑창은 경기장 표면을 손상시키거나 자국을 남기지 않는 소재여야 한다."},{"id":"4-19","set":4,"number":19,"chapter":11,"topic":"제11장 · 논발리 존 위반","level":"중","rule":"11.A.1","stem":"발리 순간 발은 논발리 존 밖에 있었지만, 선수가 들고 있는 패들 끝이 논발리 존 바닥에 닿았다. 판정은?","options":["볼이 존 밖으로 향하면 유효","발이 밖이므로 유효","리시버 폴트","발리 폴트"],"answer":3,"explanation":"발리 중에는 선수와 접촉하고 있는 물체도 논발리 존에 닿아서는 안 된다."},{"id":"4-20","set":4,"number":20,"chapter":1,"topic":"제1장 · 게임","level":"하","rule":"제1장 기본원칙","stem":"매치의 첫 득점과 매치 포인트에 대한 규정집의 기본원칙은?","options":["매치 포인트가 두 배의 가치다.","연속 득점일 때만 첫 점수의 가치가 생긴다.","첫 점수는 순위 산정용으로만 쓴다.","두 점수의 가치는 같다."],"answer":3,"explanation":"경기의 어느 시점에서 얻든 각 점수는 같은 가치를 가진다."},{"id":"4-21","set":4,"number":21,"chapter":26,"topic":"부록 A · 폴트 및 리플레이","level":"상","rule":"부록 A.1 · 21.A.2.a","stem":"선수가 서브 타격 뒤에 표준 타임아웃을 콜하면, 부록 A에 따라 그 랠리를 리플레이한다.","options":["맞다","틀리다"],"answer":1,"explanation":"서브가 이미 이루어진 뒤의 타임아웃 요청은 요청한 선수의 폴트다."},{"id":"4-22","set":4,"number":22,"chapter":23,"topic":"제23장 · 기권 및 취소","level":"중","rule":"23.A.4","stem":"매치에서 기권하더라도, 기권 전 이미 끝난 게임의 점수는 그대로 유지된다.","options":["맞다","틀리다"],"answer":0,"explanation":"기권 전 완료된 게임은 기존 점수를 남기고, 진행 중인 게임 및 미진행 게임에는 별도 기록 기준을 적용한다."},{"id":"4-23","set":4,"number":23,"chapter":3,"topic":"제3장 · 코트 및 장비","level":"하","rule":"3.A.4.b","stem":"사이드라인은 네트와 베이스라인에 수직이다.","options":["맞다","틀리다"],"answer":0,"explanation":"사이드라인은 코트 양옆의 경계다."},{"id":"4-24","set":4,"number":24,"chapter":5,"topic":"제5장 · 선수 위치 및 서브 순서","level":"중","rule":"5.C","stem":"일반 경기에서 서브 전에 상대에게 올바른 서버나 리시버가 누구인지 물을 수 있다.","options":["맞다","틀리다"],"answer":0,"explanation":"상대는 올바른 서버, 리시버 또는 선수 위치를 묻는 데 정확한 정보를 줘야 한다."},{"id":"4-25","set":4,"number":25,"chapter":16,"topic":"제16장 · 대회위원장 책임","level":"중","rule":"16.I","stem":"어떤 매치에 선심을 배정할지는 각 매치의 선수들이 최종 결정한다.","options":["맞다","틀리다"],"answer":1,"explanation":"선심을 어느 경기에 배치할지는 대회위원장이 결정한다."},{"id":"4-26","set":4,"number":26,"chapter":7,"topic":"제7장 · 서브","level":"중","rule":"7.A.2","stem":"일반 선수가 서브 타격 순간 한 발로 베이스라인을 밟아도 다른 발이 올바른 서브 구역에 있으면 유효하다.","options":["맞다","틀리다"],"answer":1,"explanation":"베이스라인은 코트 경계에 포함된다. 타격 순간 어느 발도 코트에 접촉하면 안 된다."},{"id":"4-27","set":4,"number":27,"chapter":8,"topic":"제8장 · 라인 콜","level":"중","rule":"8.F.2","stem":"유효한 라인 콜이 이뤄지면 그 결과 데드볼이 된다.","options":["맞다","틀리다"],"answer":0,"explanation":"라인 콜로 플레이가 중단된다."},{"id":"4-28","set":4,"number":28,"chapter":17,"topic":"제17장 · 심판 책임","level":"상","rule":"17.D.16","stem":"심판은 타임아웃 종료 15초 전 안내를 생략한 채 곧바로 점수부터 콜하는 것이 규정에 맞다.","options":["맞다","틀리다"],"answer":1,"explanation":"심판은 종료 15초 전을 알리고, 15초가 지난 뒤 선수들이 준비됐거나 준비됐어야 할 때 타임 인을 콜한 다음 점수를 공지한다."},{"id":"4-29","set":4,"number":29,"chapter":24,"topic":"제24장 · 심판 없는 토너먼트","level":"중","rule":"24.D","stem":"심판 없는 토너먼트에서도 상대 패들이 승인 규격에 맞는지 수석 심판 또는 대회위원장에게 판단을 요청할 수 있다.","options":["맞다","틀리다"],"answer":0,"explanation":"패들 승인 또는 규정 준수 여부에 이의가 있다면 수석 심판이나 대회위원장에게 확인을 요청한다."},{"id":"4-30","set":4,"number":30,"chapter":12,"topic":"제12장 · 플레이 중 패들","level":"중","rule":"12.A","stem":"볼이 인 플레이인 한 랠리에서 한 손에 예비 패들을 들고 다른 패들로 쳐도 된다.","options":["맞다","틀리다"],"answer":1,"explanation":"랠리 중에는 두 개 이상의 패들을 사용하거나 휴대할 수 없다."}]},{"id":5,"title":"제5회 모의고사","questions":[{"id":"5-1","set":5,"number":1,"chapter":1,"topic":"제1장 · 게임","level":"하","rule":"제1장 피클볼 소개","stem":"피클볼은 어떤 스포츠의 요소를 결합한 패들 스포츠로 소개되는가?","options":["탁구·골프·핸드볼","배드민턴·스쿼시·축구","배드민턴·탁구·테니스","테니스·배구·농구"],"answer":2,"explanation":"규정집은 피클볼을 배드민턴, 탁구, 테니스의 요소가 결합된 스포츠로 소개한다."},{"id":"5-2","set":5,"number":2,"chapter":14,"topic":"제14장 · 표준 피클볼 변형","level":"중","rule":"14.A.2","stem":"잠정 랠리 스코어링에서 A가 서브하고 B가 랠리를 이겼다. 득점하는 쪽은?","options":["어느 쪽도 득점하지 않음","두 쪽 모두","A","B"],"answer":3,"explanation":"잠정 랠리 스코어링에서는 서브권과 관계없이 랠리 승자가 득점한다."},{"id":"5-3","set":5,"number":3,"chapter":8,"topic":"제8장 · 라인 콜","level":"상","rule":"8.I","stem":"일반 경기에서 선수 A가 자신의 라인 콜을 상대 B에게 넘겼고, B는 명확히 인이라고 답했다. 무엇을 적용하는가?","options":["A가 먼저 떠올렸던 판정","B가 내린 인 판정","항상 리플레이","B의 의견을 듣되 A가 마음대로 아웃으로 변경"],"answer":1,"explanation":"판정을 넘긴 상대가 인 또는 아웃을 명확히 결정하면 그 결정을 적용한다."},{"id":"5-4","set":5,"number":4,"chapter":22,"topic":"제22장 · 비신사적인 행위 및 페널티","level":"중","rule":"22.G.2","stem":"단판 매치에서 한 팀이 그 게임을 몰수당했다. 매치 결과는?","options":["그 경기의 점수를 0–0으로 남기고 무승부 처리한다.","새 게임으로 매치를 다시 시작한다.","매치는 계속하되 다음 게임에서 서브할 수 없다.","그 팀이 매치도 몰수당한다."],"answer":3,"explanation":"한 게임으로 끝나는 매치의 경우 게임 몰수와 매치 몰수가 동일하게 적용된다."},{"id":"5-5","set":5,"number":5,"chapter":25,"topic":"제25장 · 휠체어·어댑티브 스탠딩·하이브리드 복식","level":"중","rule":"25.A.4","stem":"휠체어 규정에서 스탠딩 선수의 다리에 해당하는 위치 판단 기준은?","options":["패들 헤드의 높이","휠체어의 큰 뒷바퀴","휠체어의 작은 앞바퀴만","휠체어 좌석의 중앙"],"answer":1,"explanation":"휠체어는 선수의 일부로 보며, 위치를 판정할 때 큰 뒷바퀴를 스탠딩 선수의 다리와 같이 취급한다."},{"id":"5-6","set":5,"number":6,"chapter":9,"topic":"제9장 · 데드볼·폴트·방해요소","level":"중","rule":"9.B.1, 11.A.2","stem":"일반 경기에서 볼이 데드가 된 뒤에도 적용할 수 있는 폴트의 예는?","options":["볼이 데드가 된 뒤 다음 서브를 준비해 패들을 바꾼 경우","랠리 종료 후 상대가 라인을 밟고 이동한 경우","발리 추진력으로 논발리 존에 닿은 경우","랠리 종료 후 준비 신호가 늦은 경우"],"answer":2,"explanation":"폴트는 보통 볼이 라이브일 때 발생한다. 발리 추진력이 계속되는 논발리 존 위반은 예외다."},{"id":"5-7","set":5,"number":7,"chapter":20,"topic":"제20장 · 토너먼트 매치 상황","level":"중","rule":"20.L","stem":"모든 선수가 심판을 교체하는 데 동의했다. 누구에게 교체를 요청할 수 있는가?","options":["선심","대회위원장","상대 팀의 코치","관중 대표"],"answer":1,"explanation":"모든 선수가 동의하면 대회위원장에게 심판 교체를 요청할 수 있다."},{"id":"5-8","set":5,"number":8,"chapter":7,"topic":"제7장 · 서브","level":"상","rule":"7.B.2.a","stem":"일반 경기에서 리시버는 서버가 볼을 놓을 때 손으로 의도적으로 회전을 주는 것을 확인했다. 아직 서브를 리턴하지 않았다면?","options":["리시버는 이 상황에 아무 요청도 할 수 없다.","리플레이를 요청할 수 있다.","리턴하고 난 뒤에만 리플레이를 요청할 수 있다.","자신의 득점을 곧바로 선언할 수 있다."],"answer":1,"explanation":"서브 전 볼 놓기 과정의 조작 또는 스핀에 대해 리시버는 리턴 전에 리플레이를 요청할 수 있다."},{"id":"5-9","set":5,"number":9,"chapter":21,"topic":"제21장 · 타임아웃과 휴식","level":"상","rule":"21.B.7","stem":"11점 단일 게임 매치에서 엔드체인지 점수를 지나쳤고 이를 뒤늦게 발견했다. 처리 방법은?","options":["다음 게임 시작 때까지 그대로 진행한다.","점수를 6점에 맞춰 되돌린 후 엔드를 바꾼다.","최초로 점수를 놓친 팀에 폴트를 준다.","즉시 엔드를 바꾸고 점수와 서버는 유지한다."],"answer":3,"explanation":"뒤늦게 발견하면 그 시점에 바꾼다. 폴트나 점수 변경 없이 같은 서버가 계속한다."},{"id":"5-10","set":5,"number":10,"chapter":5,"topic":"제5장 · 선수 위치 및 서브 순서","level":"중","rule":"5.A.3, 4.A","stem":"표준 단식에서 6–4로 앞선 A가 서브한 랠리를 B가 이겼다. 다음 상태는?","options":["A가 7–4로 앞서고 B가 서브한다.","B 득점 없이 A가 반대쪽에서 서브한다.","점수는 그대로이고 B가 서브한다.","B 득점 후 A가 계속 서브한다."],"answer":2,"explanation":"표준 방식에서 리시버는 랠리 승리로 득점하지 않는다. 단식 서버가 랠리에서 패하면 서브권이 넘어간다."},{"id":"5-11","set":5,"number":11,"chapter":13,"topic":"제13장 · 네트 및 네트 지지 시스템","level":"중","rule":"13.G.1","stem":"랠리 중 선수 몸은 네트에 닿지 않았지만, 선수가 들고 있던 패들이 네트에 닿았다. 판정은?","options":["타격에 쓰인 패들이라 접촉 허용","패들을 든 선수의 폴트","네트가 움직인 경우에만 리플레이","몸만 네트에 닿지 않으면 유효"],"answer":1,"explanation":"볼이 라이브일 때 선수나 그가 소지한 패들이 네트에 닿으면 폴트다."},{"id":"5-12","set":5,"number":12,"chapter":15,"topic":"제15장 · 토너먼트 종목 및 점수 옵션","level":"중","rule":"15.A.3.b","stem":"기술 등급별 복식에서 파트너의 등급이 3.0과 3.5라면 팀 등급은 무엇을 기준으로 하는가?","options":["낮은 쪽인 3.0","두 등급의 평균인 3.25","높은 쪽인 3.5","첫 서브를 하는 선수의 등급"],"answer":2,"explanation":"기술 등급별 복식의 팀 등급은 등급이 더 높은 선수에 맞춘다."},{"id":"5-13","set":5,"number":13,"chapter":4,"topic":"제4장 · 득점","level":"하","rule":"4.B, 제1장","stem":"2점 차 승리 조건의 11점 게임에서 다음 중 게임이 정상 종료되는 점수는?","options":["10–10","11–10","11–9","10–8"],"answer":2,"explanation":"목표인 11점에 도달하고 최소 2점 앞선 11–9에서 게임이 끝난다."},{"id":"5-14","set":5,"number":14,"chapter":11,"topic":"제11장 · 논발리 존 위반","level":"상","rule":"11.A.3","stem":"논발리 존에 들어갔던 선수가 오른발만 존 바깥 바닥에 댄 뒤, 왼발을 공중에 든 채 발리했다. 판정은?","options":["폴트. 양발이 모두 바깥 표면에 먼저 닿아야 한다.","유효. 타격 순간 어느 발도 존에 닿지 않았다.","유효. 한쪽 발만 바깥에 닿으면 된다.","리플레이. 남은 한쪽 발을 확인할 수 없다."],"answer":0,"explanation":"논발리 존에 닿은 뒤에는 양발이 완전히 존 밖 경기장 표면에 접촉한 뒤에 발리할 수 있다."},{"id":"5-15","set":5,"number":15,"chapter":6,"topic":"제6장 · 선수 준비 상태와 점수 공지","level":"상","rule":"6.F.2","stem":"서브는 이미 들어왔고 아직 리턴되지는 않았다. 선수가 점수 공지가 틀렸다고 중단했지만, 점수는 정확했다. 판정은?","options":["랠리를 멈춘 선수의 폴트","올바른 점수를 다시 부르고 무조건 리플레이","점수를 공지한 사람의 폴트","리시버가 선택하는 인 또는 아웃"],"answer":0,"explanation":"서브 리턴 전이라도 실제 점수 공지가 올바른 경우 중단한 선수에게 폴트가 부과된다."},{"id":"5-16","set":5,"number":16,"chapter":10,"topic":"제10장 · 랠리 상황","level":"중","rule":"10.G.2","stem":"일반 경기의 랠리가 끝난 뒤 볼이 깨지거나 갈라지지 않고 마모되어 성능만 저하된 것을 확인했다. 직전 랠리 처리는?","options":["직전 랠리 패자에게 자동으로 서브권이 간다.","라스트 샷만 다시 친다.","선수가 한 명만 원해도 다시 한다.","성능 저하만을 이유로 리플레이하지 않는다."],"answer":3,"explanation":"볼이 마모되거나 성능만 저하됐다면 랠리 결과를 유지한다."},{"id":"5-17","set":5,"number":17,"chapter":3,"topic":"제3장 · 코트 및 장비","level":"중","rule":"3.A.2","stem":"코트 규격을 잴 때 기준이 되는 라인의 위치는?","options":["사이드라인·베이스라인 및 논발리 존 라인의 바깥쪽 경계","센터라인 중심과 네트 기둥 바깥쪽","모든 라인의 안쪽 경계","모든 라인의 중앙"],"answer":0,"explanation":"코트 규격은 외곽 라인과 논발리 존 라인의 바깥쪽 경계를 기준으로 측정한다."},{"id":"5-18","set":5,"number":18,"chapter":2,"topic":"제2장 · 정의","level":"하","rule":"제2장 정의","stem":"코트와 그 주변에서 경기를 위해 지정한 구역을 합한 용어는?","options":["경기장 표면","서브 구역","서비스 코트","네트의 면"],"answer":0,"explanation":"경기장 표면은 코트뿐 아니라 플레이에 지정된 주변 지역도 포함한다."},{"id":"5-19","set":5,"number":19,"chapter":18,"topic":"제18장 · 매치 전 선수 책임","level":"중","rule":"18.B.3","stem":"매치 도중 대회위원장이 볼과 비슷한 색의 복장을 부적절하다고 판단해 교체를 요구했다. 적용되는 타임아웃은?","options":["심판 타임아웃","메디컬 타임아웃","상대 팀의 표준 타임아웃","게임 간 타임아웃"],"answer":0,"explanation":"매치 중 대회 규정에 따른 복장 교체가 필요하면 심판 타임아웃을 적용한다."},{"id":"5-20","set":5,"number":20,"chapter":19,"topic":"제19장 · 토너먼트 라인 콜","level":"상","rule":"19.D~19.D.1","stem":"매치를 끝낸 타구의 라인 판정에 이의를 제기하는 경우 마감 시점은?","options":["스코어시트에 서명한 뒤 10분까지","양 팀이 다음 매치를 시작하기 전","대회가 끝날 때까지","스코어시트에 서명하기 전"],"answer":3,"explanation":"랠리를 끝낸 샷에만 이의를 제기할 수 있으며, 매치를 끝낸 샷은 스코어시트 서명 전까지다."},{"id":"5-21","set":5,"number":21,"chapter":6,"topic":"제6장 · 선수 준비 상태와 점수 공지","level":"중","rule":"6.A.2","stem":"방해요소가 없는 상황에서 점수 공지가 시작된 뒤 머리 위로 패들을 들면 유효한 준비 안 됨 신호가 된다.","options":["맞다","틀리다"],"answer":1,"explanation":"점수 공지가 시작되면 방해요소를 알리는 예외가 없는 한 해당 신호는 유효하지 않다."},{"id":"5-22","set":5,"number":22,"chapter":24,"topic":"제24장 · 심판 없는 토너먼트","level":"상","rule":"24.E","stem":"심판 없는 토너먼트에서 다음 게임 직전에 표준 타임아웃을 쓸 예정이라도 상대에게 알릴 필요는 없다.","options":["맞다","틀리다"],"answer":1,"explanation":"게임 사이의 표준 타임아웃 사용 의도는 다음 게임 시작 전에 상대에게 알려야 한다."},{"id":"5-23","set":5,"number":23,"chapter":17,"topic":"제17장 · 심판 책임","level":"중","rule":"17.D.6","stem":"심판은 랠리 종료 또는 타임아웃 콜이 있을 때 스코어시트에 적절히 기록해야 한다.","options":["맞다","틀리다"],"answer":0,"explanation":"심판은 랠리가 끝나거나 타임아웃이 불릴 때 필요한 내용을 스코어시트에 기록한다."},{"id":"5-24","set":5,"number":24,"chapter":15,"topic":"제15장 · 토너먼트 종목 및 점수 옵션","level":"중","rule":"15.G","stem":"패자전 없는 단일 탈락 종목에도 선수마다 반드시 두 매치가 보장된다.","options":["맞다","틀리다"],"answer":1,"explanation":"패자전 없는 단일 탈락 종목은 최소 두 매치 출전 기회 규정에서 제외된다."},{"id":"5-25","set":5,"number":25,"chapter":12,"topic":"제12장 · 플레이 중 패들","level":"상","rule":"12.A~B","stem":"랠리 사이에 패들을 한 개에서 다른 한 개로 교체하고 다음 랠리에는 새 패들 한 개만 소지하는 행위 자체는 두 패들 사용 폴트가 아니다.","options":["맞다","틀리다"],"answer":0,"explanation":"두 패들 사용·휴대 제한은 랠리 중 적용된다. 다음 랠리에서 적법한 패들 한 개만 소지하는 상황에는 이 폴트가 적용되지 않는다."},{"id":"5-26","set":5,"number":26,"chapter":23,"topic":"제23장 · 기권 및 취소","level":"중","rule":"23.B.2~3","stem":"대진 취소가 처리된 뒤에도 같은 대진의 남은 예정 매치 한 경기에 다시 출전할 수 있다.","options":["맞다","틀리다"],"answer":1,"explanation":"대진에서 취소한 선수나 팀은 해당 대진의 모든 잔여 예정 매치에서 제외된다."},{"id":"5-27","set":5,"number":27,"chapter":16,"topic":"제16장 · 대회위원장 책임","level":"중","rule":"16.H","stem":"대회위원장은 복식 각 게임에서 양 팀의 경기시작 서버를 식별할 수 있는 방법을 제공해야 한다.","options":["맞다","틀리다"],"answer":0,"explanation":"대회위원장이 식별 수단을 마련하며, 선수의 표시 착용 의무는 제18장에서 규정한다."},{"id":"5-28","set":5,"number":28,"chapter":10,"topic":"제10장 · 랠리 상황","level":"상","rule":"10.D.2","stem":"복식에서 두 파트너가 같은 볼을 차례로 한 번씩 친 리턴은 한 방향으로 갔다면 합법이다.","options":["맞다","틀리다"],"answer":1,"explanation":"한 번의 리턴에서 두 파트너의 패들이 모두 볼에 닿으면 폴트다."},{"id":"5-29","set":5,"number":29,"chapter":26,"topic":"부록 A · 폴트 및 리플레이","level":"상","rule":"부록 A.2 · 25.A.12.c","stem":"토너먼트 휠체어 서브에서 큰 뒷바퀴가 서브 구역 밖에 닿았는지 불분명하면 심판은 리플레이를 콜할 수 있다.","options":["맞다","틀리다"],"answer":0,"explanation":"서브 순간 큰 뒷바퀴의 구역 밖 접촉 여부가 명확하지 않으면 심판은 리플레이할 수 있다."},{"id":"5-30","set":5,"number":30,"chapter":3,"topic":"제3장 · 코트 및 장비","level":"하","rule":"3.C.4","stem":"승인 볼 표면에는 제조업체 또는 공급업체의 이름이나 로고가 표시되어야 한다.","options":["맞다","틀리다"],"answer":0,"explanation":"볼의 브랜드 정보는 인쇄 또는 음각으로 표기한다."}]}]</script>
<script>
"use strict";
const sets = JSON.parse(document.getElementById("bank").textContent);
const allQuestions = sets.flatMap(set => set.questions);
const questions = Object.fromEntries(allQuestions.map(question => [question.id, question]));
const app = document.getElementById("app");
const dialog = document.getElementById("confirm");
const labels = ["①", "②", "③", "④"];
const syllabus = Array.from(new Map(sets[0].questions.map(q => [q.chapter, q.topic])))
  .sort(([first], [second]) => first - second);
const storeKey = "kpa-grade3-2026-full-syllabus-v2";
const initialState = () => ({ drafts: {}, results: {}, notes: {}, retry: null, retryResult: null });
let canSave = true;
let state = initialState();
try {
  state = { ...state, ...JSON.parse(localStorage.getItem(storeKey) || "{}") };
} catch {
  canSave = false;
}
let view = { type: "home" };
let pending = null;

function save() {
  try {
    localStorage.setItem(storeKey, JSON.stringify(state));
  } catch {
    canSave = false;
  }
}
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]
  ));
}
function button(label, action, props = "") {
  return `<button class="btn" data-act="${action}" ${props}>${label}</button>`;
}
function primary(label, action, props = "") {
  return button(label, action, props).replace('class="btn"', 'class="btn primary"');
}
const openNotes = () => allQuestions.filter(q => state.notes[q.id] && !state.notes[q.id].resolved);
const getDraft = () => view.id === "retry" ? state.retry : state.drafts[view.id];
const displayAnswer = (q, position) => position == null ? "미응답" : (q.options.length === 2 ? ["O", "X"][position] : `${labels[position]} ${q.options[position]}`);
const setName = id => sets[id - 1].title;
const answered = answers => Object.keys(answers).length;

function render(focusSelector) {
  document.getElementById("nav-home").setAttribute("aria-current", ["notes", "study"].includes(view.type) ? "false" : "page");
  document.getElementById("nav-notes").setAttribute("aria-current", view.type === "notes" ? "page" : "false");
  document.getElementById("note-count").textContent = openNotes().length || "";
  const pages = { home: renderHome, exam: renderExam, results: renderResults, notes: renderNotes, study: renderStudy };
  app.innerHTML = (!canSave ? '<p role="status" class="status">이 브라우저에서 저장을 사용할 수 없습니다. 탭을 닫기 전에 오답 메모를 내려받을 수 있습니다.</p>' : "") + pages[view.type]();
  if (focusSelector) app.querySelector(focusSelector)?.focus({ preventScroll: true });
}
function navigate(next) {
  view = next;
  render("#page-heading");

"9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#235c46"/></marker></defs><text x="68" y="20">A팀</text><text x="288" y="20">B팀</text><rect x="18" y="29" width="324" height="113" fill="white" stroke="#547467"/><rect x="135" y="29" width="90" height="113" fill="#e6eee7" stroke="#879e90"/><path d="M180 29v113M18 86h117M225 86h117" stroke="#547467"/><path d="M253 54L107 118" stroke="#235c46" stroke-width="3" marker-end="url(#tip2)"/><text x="72" y="124">지수</text><text x="72" y="60">민지</text><rect x="258" y="39" width="60" height="30" rx="5" stroke="#235c46" stroke-width="3" fill="#e4efbb"/><text x="288" y="60">유진</text><text x="288" y="124">서연</text></svg><p>민지는 두 번째 서버였으므로 사이드 아웃. B팀이 서브권을 받아 자기 점수 0을 먼저 공지. 유진이 오른쪽에서 시작.</p></figure><figure><figcaption><b>4. B팀 득점</b> · 다음 서브 콜 <strong>1–1–1</strong></figcaption><svg viewBox="0 0 360 155" role="img" aria-label="B팀 득점, 1–1–1. 서브한 유진이 랠리 승리. B팀만 자리 교대. 유진은 왼쪽에서 첫 번째 서버로 계속 서브."><defs><marker id="tip3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#235c46"/></marker></defs><text x="68" y="20">A팀</text><text x="288" y="20">B팀</text><rect x="18" y="29" width="324" height="113" fill="white" stroke="#547467"/><rect x="135" y="29" width="90" height="113" fill="#e6eee7" stroke="#879e90"/><path d="M180 29v113M18 86h117M225 86h117" stroke="#547467"/><path d="M253 118L107 54" stroke="#235c46" stroke-width="3" marker-end="url(#tip3)"/><text x="72" y="124">지수</text><text x="72" y="60">민지</text><text x="288" y="60">서연</text><rect x="258" y="103" width="60" height="30" rx="5" stroke="#235c46" stroke-width="3" fill="#e4efbb"/><text x="288" y="124">유진</text></svg><p>서브한 유진이 랠리 승리. B팀만 자리 교대. 유진은 왼쪽에서 첫 번째 서버로 계속 서브.</p></figure><figure><figcaption><b>5. 유진의 랠리 패배</b> · 다음 서브 콜 <strong>1–1–2</strong></figcaption><svg viewBox="0 0 360 155" role="img" aria-label="유진의 랠리 패배, 1–1–2. 첫 번째 서버가 졌으므로 점수와 자리는 유지. 파트너 서연이 현재 위치인 오른쪽에서 두 번째 서버로 서브."><defs><marker id="tip4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#235c46"/></marker></defs><text x="68" y="20">A팀</text><text x="288" y="20">B팀</text><rect x="18" y="29" width="324" height="113" fill="white" stroke="#547467"/><rect x="135" y="29" width="90" height="113" fill="#e6eee7" stroke="#879e90"/><path d="M180 29v113M18 86h117M225 86h117" stroke="#547467"/><path d="M253 54L107 118" stroke="#235c46" stroke-width="3" marker-end="url(#tip4)"/><text x="72" y="124">지수</text><text x="72" y="60">민지</text><rect x="258" y="39" width="60" height="30" rx="5" stroke="#235c46" stroke-width="3" fill="#e4efbb"/><text x="288" y="60">서연</text><text x="288" y="124">유진</text></svg><p>첫 번째 서버가 졌으므로 점수와 자리는 유지. 파트너 서연이 현재 위치인 오른쪽에서 두 번째 서버로 서브.</p></figure><figure><figcaption><b>6. 서연의 랠리 패배</b> · 다음 서브 콜 <strong>1–1–1</strong></figcaption><svg viewBox="0 0 360 155" role="img" aria-label="서연의 랠리 패배, 1–1–1. 두 번째 서버도 졌으므로 사이드 아웃. A팀에서 지금 오른쪽에 있는 지수가 새 첫 번째 서버."><defs><marker id="tip5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#235c46"/></marker></defs><text x="68" y="20">A팀</text><text x="288" y="20">B팀</text><rect x="18" y="29" width="324" height="113" fill="white" stroke="#547467"/><rect x="135" y="29" width="90" height="113" fill="#e6eee7" stroke="#879e90"/><path d="M180 29v113M18 86h117M225 86h117" stroke="#547467"/><path d="M107 118L253 54" stroke="#235c46" stroke-width="3" marker-end="url(#tip5)"/><rect x="42" y="103" width="60" height="30" rx="5" stroke="#235c46" stroke-width="3" fill="#e4efbb"/><text x="72" y="124">지수</text><text x="72" y="60">민지</text><text x="288" y="60">서연</text><text x="288" y="124">유진</text></svg><p>두 번째 서버도 졌으므로 사이드 아웃. A팀에서 지금 오른쪽에 있는 지수가 새 첫 번째 서버.</p></figure></div><p><b>단식과 비교</b> · 서버 점수와 리시버 점수 두 숫자만 공지. 예를 들어 4–3에서 서버가 이기면 5–3, 같은 선수가 왼쪽에서 계속 서브. 4–3에서 서버가 지면 상대가 서브권을 받아 3–4로 공지하고 왼쪽에서 서브.</p><p class="ref">강의 13~18쪽 · 규정집 4.A, 5.A~B, 6.B</p></div><ul class="topic-list"><li><strong>단식</strong> · 서버 점수 0·짝수면 오른쪽, 홀수면 왼쪽. 서버가 랠리에서 패하면 상대에게 서브권 이전</li><li><strong>표준 복식</strong> · 서브 팀 점수 → 리시브 팀 점수 → 서버 번호 순서로 공지. 게임 첫 콜은 0–0–2. 이후 사이드 아웃을 받으면 오른쪽에 올바르게 위치한 선수가 첫 서버</li><li><strong>준비와 시간</strong> · 준비되지 않았으면 점수 공지 전에 패들 또는 빈손을 머리 위로 들거나 네트에 등을 돌려 표시. 점수 공지 완료 후 10초 이내 서브</li><li><strong>발 위치</strong> · 타격 순간 적어도 한 발은 올바른 서브 구역 바닥에 접촉. 어느 발도 베이스라인·코트 안·올바른 서브 구역 밖 바닥에 접촉 금지</li><li><strong>볼 놓기</strong> · 한 손 또는 패들로 리시버에게 보이게 놓기. 놓는 과정에서 인위적인 스핀 금지. 패들로 타격하는 순간의 회전은 허용</li><li><strong>발리 서브</strong> · 바운스 전 타격. 타격 순간 명확한 상향 곡선 필요. 패들 헤드 최고점이 손목 관절 최고점보다, 볼이 허리보다 분명히 높으면 폴트</li><li><strong>드롭 서브</strong> · 자연스러운 높이에서 힘을 더하지 않고 떨어뜨린 뒤 타격. 타격 전 바운스 횟수와 경기장 표면 안의 바운스 위치 제한 없음</li><li><strong>착지</strong> · 대각선 서비스 코트의 베이스라인·사이드라인·센터라인에 닿으면 인. 논발리 존 라인에 처음 닿으면 서버 폴트</li></ul><p class="ref">강의 5·14~23쪽 / 규정집 3.A.4, 제5~7장, 8.B~C</p></section><section class="panel study"><h2>랠리·발리·네트 주변 판정</h2><figure class="study-fig"><svg viewBox="0 0 480 271" role="img" aria-labelledby="bounce-title bounce-desc"><title id="bounce-title">투 바운스 룰</title><desc id="bounce-desc">굵은 점은 공이 바닥에 닿는 위치. 두 팀에서 한 번씩 바운스한 뒤부터 논발리 존 규정을 지켜 발리 가능.</desc><defs><marker id="flight" viewBox="0 0 10 10" markerWidth="4" markerHeight="4" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#244638"/></marker></defs><text x="16" y="29" font-size="20" text-anchor="start" font-weight="720">① 서브 → 리시브 팀에서 첫 바운스</text><path d="M28 108H452M240 62v46" stroke="#7a887e" stroke-width="3"/><g transform="translate(0 44) scale(1 1)"><path d="M54 42 Q190 -35 360 64 Q376 41 414 39" fill="none" stroke="#244638" stroke-width="4" marker-end="url(#flight)"/><circle cx="360" cy="63" r="6" fill="#244638"/></g><text x="16" y="140" font-size="20" text-anchor="start" font-weight="720">② 서브 리턴 → 서브 팀에서 첫 바운스</text><path d="M28 219H452M240 173v46" stroke="#7a887e" stroke-width="3"/><g transform="translate(480 155) scale(-1 1)"><path d="M54 42 Q190 -35 360 64 Q376 41 414 39" fill="none" stroke="#244638" stroke-width="4" marker-end="url(#flight)"/><circle cx="360" cy="63" r="6" fill="#244638"/></g><text x="76" y="255" font-size="18" text-anchor="middle" font-weight="550">서브 팀</text><text x="402" y="255" font-size="18" text-anchor="middle" font-weight="550">리시브 팀</text></svg><figcaption><strong>투 바운스 룰</strong> · 굵은 점은 공이 바닥에 닿는 위치. 두 팀에서 한 번씩 바운스한 뒤부터 논발리 존 규정을 지켜 발리 가능.</figcaption></figure><ul class="topic-list"><li><strong>투 바운스 룰</strong> · 리시브 팀은 서브를 한 번 바운스시킨 후 리턴. 서브 팀도 그 첫 리턴을 한 번 바운스시킨 후 타격</li><li><strong>논발리 존 안의 타격</strong> · 바운스한 공은 존 안에서 타격 가능. 존 접촉 후 다시 발리하려면 양발 모두 존 밖 바닥에 먼저 접촉</li><li><strong>발리 추진력</strong> · 발리 후 관성으로 존 라인을 밟거나 존에 닿아 있는 파트너와 접촉하면 폴트. 볼이 이미 데드가 된 뒤에도 적용</li><li><strong>더블 히트·헛스윙</strong> · 한 선수의 한 방향 연속 스트로크에서 두 번 맞으면 허용. 두 파트너가 차례로 같은 공을 치면 폴트. 헛스윙만으로는 데드볼이 되지 않음</li><li><strong>패들 소지</strong> · 랠리 중 한 개만 휴대. 타격 순간 손에 쥐고 있어야 함. 패들 위에 공을 잡거나 얹어 운반하면 폴트</li><li><strong>네트와 지지 구조물</strong> · 서브가 네트 상단을 스치고 올바른 코트에 착지하면 유효. 서브가 크로스바에 맞으면 서버 폴트. 일반 리턴이 네트를 넘은 뒤 상대 코트 경계 안 크로스바에 맞으면 리플레이</li><li><strong>기둥과 네트 평면</strong> · 기둥 바깥을 돌아가는 리턴 허용. 네트 아래 또는 네트와 기둥 사이로 보내면 폴트. 자기 쪽에서 친 직후의 연속 동작은 네트에 닿지 않고 평면을 넘을 수 있음</li><li><strong>영구물체 접촉</strong> · 타구가 바운스 전 천장·펜스에 맞으면 타구자 폴트. 상대 코트에 먼저 바운스한 뒤 펜스에 맞으면 받아야 했던 쪽의 폴트</li></ul><p class="ref">강의 3·28~37쪽 / 규정집 제10~13장, 부록 A</p></section><section class="panel study"><h2>라인 콜·이의 제기·리플레이</h2><ul class="topic-list"><li><strong>라인 콜</strong> · 공과 라인 사이에 명확한 틈이 보일 때 아웃 콜. 복식 파트너의 판단이 갈리면 인. 공중의 볼에 파트너가 “나간다”고 말한 것은 의사소통</li><li><strong>잘못된 점수</strong> · 실제로 점수가 틀렸고 서브 리턴 전·데드볼 전에 중단 → 정정 후 리플레이. 리턴 뒤 점수를 이유로 중단 → 중단자 폴트. 랠리 완료 뒤 발견 → 결과 유지, 다음 서브 전 정정</li><li><strong>선수 위치 오류</strong> · 점수 공지 시 실제 위치 오류를 랠리 중 정확히 지적해 중단 → 리플레이. 잘못 지적해 중단 → 중단자 폴트. 종료 후 시작 위치 오류 발견 → 랠리 결과 유지</li><li><strong>외부 방해요소</strong> · 옆 코트의 공이 굴러와 플레이에 영향을 준 경우 등. 유효한 방해요소는 리플레이. 심판 있는 경기에서 심판이 콜을 무효로 판단하면 콜한 선수 폴트</li><li><strong>아웃에서 인으로 번복</strong> · 심판이 선수의 아웃 콜을 번복 → 콜한 선수 측 폴트. 선심의 아웃 콜을 번복 → 원칙적으로 리플레이, 수혜 팀의 랠리 양보 가능</li><li><strong>손상된 볼</strong> · 일반 경기에서 모든 선수가 균열이 랠리 결과에 영향을 줬다고 동의 → 리플레이. 단순 마모 → 기존 결과 유지. 심판 있는 대회에서는 심판이 손상과 영향 판단</li></ul><p class="ref">강의 16·24~27·31쪽 / 규정집 5.C, 6.F, 제8~9장, 10.G, 19.F, 20.F·H, 부록 A</p></section><section class="panel study"><h2>대회 운영·휴식·제재</h2><ul class="topic-list"><li><strong>운영 주체</strong> · 대회위원장은 대회 운영·인력 배치 총괄. 심판은 코트·장비 사전 점검과 매치 판정 담당. 선수는 승인 패들·복장·경기 일정 확인</li><li><strong>경기 방식</strong> · 리그전 순위는 매치 승수 우선. 동률 시 맞대결 기록, 이어 전체 게임 득실점 차 비교. 기술 등급별 복식은 두 선수 중 높은 등급 적용</li><li><strong>비규격 패들</strong> · 매치 전 발견 → 무벌칙 교체. 진행 중 발견 → 매치 몰수. 종료 후 발견 → 해당 매치 결과 유지</li><li><strong>표준 타임아웃</strong> · 11·15점 게임은 단식 선수 또는 복식 팀당 2회, 21점 게임은 3회. 회당 최대 1분</li><li><strong>엔드체인지</strong> · 단일 게임·타이브레이커 게임에서 11점제는 6점, 15점제는 8점, 21점제는 11점에 교대. 게임 중 교대 후 같은 서버로 재개</li><li><strong>메디컬 타임아웃</strong> · 선수별 매치당 1회, 최대 15분. 의료진 도착 때부터 측정. 조기 복귀 시 남은 시간 소멸</li><li><strong>경고와 파울</strong> · 구두·테크니컬 경고 자체로는 점수·서버 변화 없음. 테크니컬 파울은 위반 팀 1점 차감, 위반 팀이 0점이면 상대 1점 가산</li><li><strong>몰수·기권·취소</strong> · 게임 몰수는 몰수 팀 점수 0점 기록. 매치 기권은 진행 중 게임에서 기권 팀의 실제 점수 기록. 대진 취소는 잔여 경기 전체에서 제외, 미진행 게임 0–0 기록</li><li><strong>심판 없는 대회</strong> · 선수들이 직접 판정하고 결과 보고. 반복 위반이나 해결하기 어려운 분쟁은 심판·대회위원장에게 요청 가능</li></ul><p class="ref">강의 40~45쪽 / 규정집 제15~24장</p></section><section class="panel study"><h2>휠체어·어댑티브·하이브리드</h2><ul class="topic-list"><li><strong>휠체어 서브</strong> · 큰 뒷바퀴 두 개 모두 올바른 서브 구역 바닥에 접촉. 작은 앞바퀴의 코트 진입 허용. 타격 시 적어도 한쪽 엉덩이는 좌석에 접촉</li><li><strong>휠체어 리턴·발리</strong> · 첫 바운스는 코트 안, 두 번째는 경기장 표면 어디든 허용. 세 번째 바운스 전 리턴. 발리 시 작은 앞바퀴와 뒤쪽 안정화 바퀴의 논발리 존 접촉 허용</li><li><strong>어댑티브 스탠딩</strong> · 보조기·의족·목발 등은 신체 일부로 취급. 보조 장치로 공을 타격하거나 의도적으로 궤적을 바꾸는 행위 금지</li><li><strong>더블 바운스 옵션</strong> · 자격 있는 어댑티브 스탠딩 선수가 해당 종목에서 사용하려면 매치 전 신고. 해당 매치 전체에 적용</li><li><strong>하이브리드 복식</strong> · 휠체어 선수 1명 + 스탠딩 선수 1명으로 팀 구성. 각 선수에게 해당하는 규정 적용</li></ul><p class="ref">강의 46~50쪽 / 규정집 제25장</p></section><section class="panel study"><h2>지도 계획·시범·동기유발</h2><ul class="topic-list"><li><strong>계획 순서</strong> · 학습자 특성 파악 → 수준에 맞는 과제 제시 → 동기유발 → 보강정보 활용</li><li><strong>숙련자 시범</strong> · 정확한 동작의 형태와 순서 관찰. 처음 배우는 기술의 기준 동작 제시</li><li><strong>초보자·동료 시범</strong> · 초보자 시범은 흔한 오류와 수정 방법 관찰에 활용. 동료 시범은 비슷한 수준의 성공 경험을 보여 자신감 형성</li><li><strong>목표 설정</strong> · 과제 목표는 수행 과제의 달성에 초점(지정 구역에 서브 10회 성공). 과정 목표는 동작 수행에 초점(상향 스윙 유지). 결과 목표는 승패·순위 등 최종 성과에 초점</li></ul><p class="ref">이론교육 강의 51~53쪽</p></section><section class="panel study"><h2>연습 구성·기술 습득</h2><figure class="study-fig"><svg viewBox="0 0 480 197" role="img" aria-labelledby="order-title order-desc"><title id="order-title">같은 기술도 연습 순서에 따라 달라지는 구성</title><desc id="order-desc">왼쪽부터 한 칸이 한 번의 시행. 구획연습은 같은 기술을 묶어서 반복하고, 무선연습은 여러 기술의 순서를 예측하기 어렵게 배치.</desc><text x="12" y="30" font-size="20" text-anchor="start" font-weight="720">구획연습</text><rect x="12" y="42" width="68" height="42" rx="6" stroke="#244638" fill="#e4efbb"/><text x="46" y="70" font-size="17" text-anchor="middle" font-weight="550">서브</text><rect x="89" y="42" width="68" height="42" rx="6" stroke="#244638" fill="#e4efbb"/><text x="123" y="70" font-size="17" text-anchor="middle" font-weight="550">서브</text><rect x="166" y="42" width="68" height="42" rx="6" stroke="#244638" fill="#e4efbb"/><text x="200" y="70" font-size="17" text-anchor="middle" font-weight="550">서브</text><rect x="243" y="42" width="68" height="42" rx="6" stroke="#244638" fill="#fff"/><text x="277" y="70" font-size="17" text-anchor="middle" font-weight="550">딩크</text><rect x="320" y="42" width="68" height="42" rx="6" stroke="#244638" fill="#fff"/><text x="354" y="70" font-size="17" text-anchor="middle" font-weight="550">딩크</text><rect x="397" y="42" width="68" height="42" rx="6" stroke="#244638" fill="#fff"/><text x="431" y="70" font-size="17" text-anchor="middle" font-weight="550">딩크</text><text x="12" y="127" font-size="20" text-anchor="start" font-weight="720">무선연습의 예</text><rect x="12" y="139" width="68" height="42" rx="6" stroke="#244638" fill="#fff"/><text x="46" y="167" font-size="17" text-anchor="middle" font-weight="550">딩크</text><rect x="89" y="139" width="68" height="42" rx="6" stroke="#244638" fill="#dbe9df"/><text x="123" y="167" font-size="17" text-anchor="middle" font-weight="550">발리</text><rect x="166" y="139" width="68" height="42" rx="6" stroke="#244638" fill="#e4efbb"/><text x="200" y="167" font-size="17" text-anchor="middle" font-weight="550">서브</text><rect x="243" y="139" width="68" height="42" rx="6" stroke="#244638" fill="#dbe9df"/><text x="277" y="167" font-size="17" text-anchor="middle" font-weight="550">발리</text><rect x="320" y="139" width="68" height="42" rx="6" stroke="#244638" fill="#fff"/><text x="354" y="167" font-size="17" text-anchor="middle" font-weight="550">딩크</text><rect x="397" y="139" width="68" height="42" rx="6" stroke="#244638" fill="#e4efbb"/><text x="431" y="167" font-size="17" text-anchor="middle" font-weight="550">서브</text></svg><figcaption><strong>같은 기술도 연습 순서에 따라 달라지는 구성</strong> · 왼쪽부터 한 칸이 한 번의 시행. 구획연습은 같은 기술을 묶어서 반복하고, 무선연습은 여러 기술의 순서를 예측하기 어렵게 배치.</figcaption></figure><ul class="topic-list"><li><strong>과제 순서</strong> · 구획연습은 한 기술을 모아서 반복한 뒤 다음 기술로 이동. 무선연습은 여러 기술을 섞어 매번 과제에 맞는 동작 선택</li><li><strong>습득·파지·전이</strong> · 구획연습은 초기 수행 향상에 유리. 무선연습은 연습 당일 정확도가 낮아 보여도 이후 파지와 새로운 상황으로의 전이에 유리할 수 있음</li><li><strong>휴식 배분</strong> · 집중연습은 짧은 휴식으로 연속 반복. 분산연습은 시행 사이 충분한 휴식 배치. 과제 순서와 휴식 배분은 별개의 설계 기준</li><li><strong>전습법·분습법</strong> · 전습법은 전체 동작을 한 흐름으로 연습. 분습법은 복잡한 동작을 학습자 수준에 맞게 나누어 연습</li><li><strong>분습의 세 방법</strong> · 분절화는 시간 순서에 따라 구간 분리. 단순화는 공의 속도 등 난도 조절. 부분화는 동시에 작동하는 요소 중 하나만 따로 연습</li><li><strong>가이던스</strong> · 신체적 가이던스는 자세를 직접 잡아 주는 도움. 언어적 가이던스는 핵심 동작을 말로 안내. 숙련될수록 도움을 줄여 자기 오류 탐지 유도</li></ul><p class="ref">이론교육 강의 54~59쪽</p></section><section class="panel study"><h2>피드백·오류 수정</h2><ul class="topic-list"><li><strong>정보의 출처</strong> · 감각 피드백은 선수가 시각·촉각 등으로 직접 감지한 정보. 보강 피드백은 코치·영상·장비가 추가로 제공하는 정보</li><li><strong>정보의 내용</strong> · 수행지식(KP)은 동작 과정에 관한 정보(“타격 때 패들 면이 위로 열렸어요”). 결과지식(KR)은 목표 달성 정도에 관한 정보(“공이 목표보다 50cm 길었어요”)</li><li><strong>보강 피드백의 기능</strong> · 오류와 수정 방향에 대한 정보 제공, 바람직한 행동 강화, 학습 지속을 위한 동기유발</li><li><strong>빈도와 정밀성</strong> · 초기에는 핵심 동작을 자주 안내하고 숙련에 따라 빈도 축소. 초보자에게는 방향 위주의 단서, 숙련자에게는 구체적인 수치 활용</li><li><strong>제시 시기</strong> · 타격 후 결과를 바로 알려주기 전에 학습자가 자기 감각으로 결과를 추정할 시간 확보</li></ul><p class="ref">이론교육 강의 60~63쪽</p></section>`;}

function submit() {
  const draft = getDraft();
  const miss = draft.ids.length - answered(draft.answers);
  document.getElementById("confirm-title").textContent = "답안을 제출할까요?";
  document.getElementById("confirm-copy").textContent = miss
    ? `미응답 ${miss}문항은 오답으로 채점됩니다. 취소를 누르면 계속 풀 수 있습니다.`
    : "제출하면 점수와 문항별 해설을 확인할 수 있습니다.";
  document.getElementById("confirm-button").textContent = "제출하기";
  pending = grade;
  dialog.showModal();
}
function grade() {
  const draft = getDraft();
  const isRetry = view.id === "retry";
  const result = { ids: [...draft.ids], answers: { ...draft.answers }, correct: 0 };
  for (const id of result.ids) {
    const correct = result.answers[id] === questions[id].answer;
    if (correct) result.correct++;
    if (!correct || state.notes[id]) {
      const note = state.notes[id];
      state.notes[id] = {
        ...note,
        answer: correct ? note.answer : result.answers[id] ?? null,
        resolved: correct,
      };
    }
  }
  if (isRetry) {
    state.retryResult = result;
    state.retry = null;
  } else {
    result.best = Math.max(result.correct, state.results[view.id]?.best ?? 0);
    state.results[view.id] = result;
    delete state.drafts[view.id];
  }
  save();
  navigate({ type: "results", id: view.id, filter: "all" });
}
function review(q, answer, correctness, includeMemo, fromNotes = false) {
  const answerText = esc(displayAnswer(q, q.answer));
  const note = state.notes[q.id];
  return `<details class="panel">
    <summary><span class="pill ${correctness ? "" : "wrong"}">${correctness ? (fromNotes ? "복습 완료" : "정답") : answer == null ? "미응답" : "오답"}</span><span>${q.set}회 ${q.number}번 · ${esc(q.stem)}</span></summary>
    <div class="review-body">
      ${q.options.length === 4 ? `<ul class="review-options">${q.options.map((option, index) => `<li class="${index === q.answer ? "correct" : ""}">${labels[index]} ${esc(option)}</li>`).join("")}</ul>` : ""}
      <p><b>${fromNotes && correctness ? "이전 오답" : "내 답"}</b> · ${esc(displayAnswer(q, answer))}</p>
      <p><b>정답</b> · ${answerText}</p>
      <p>${esc(q.explanation)}</p>
      <p class="ref">${esc(q.topic)} · 난이도 ${q.level}<br>규정 근거 ${esc(q.rule)}</p>
      ${includeMemo ? `<label class="memo">내 메모<textarea data-note="${q.id}" maxlength="1200" placeholder="헷갈린 규정이나 기억할 점">${esc(note?.memo)}</textarea></label><p class="hint">메모는 입력할 때 저장됩니다.</p>` : ""}
    </div>
  </details>`;
}
function renderResults() {
  const retry = view.id === "retry";
  const result = retry ? state.retryResult : state.results[view.id];
  const total = result.ids.length;
  const wrong = result.ids.filter(id => result.answers[id] !== questions[id].answer);
  const missing = total - answered(result.answers);
  const displayIds = view.filter === "wrong" ? wrong : result.ids;
  const hasRetry = Boolean(state.retry);
  return `<section class="panel score">
    <div class="eyebrow">${retry ? "오답 재시험" : `제 ${view.id}회 모의시험`}</div>
    <h1 id="page-heading" tabindex="-1" class="page-title">채점 결과</h1>
    <strong>${result.correct} <span>/ ${total}문항</span></strong>
    <p>정답 ${result.correct}개 · 오답 ${wrong.length - missing}개 · 미응답 ${missing}개</p>
    <div class="actions">
      ${wrong.length || hasRetry ? primary(hasRetry ? "진행 중인 오답 풀이 이어서" : "틀린 문제 다시 풀기", "retry-result") : ""}
      ${button("오답노트 보기", "notes")}
      ${button("회차 선택", "home")}
    </div>
  </section>
  <h2>문항별 해설</h2>
  <div class="filters" aria-label="결과 필터">
    ${button(`전체 ${total}`, "result-filter", `data-value="all" aria-pressed="${view.filter === "all"}"`)}
    ${button(`오답·미응답 ${wrong.length}`, "result-filter", `data-value="wrong" aria-pressed="${view.filter === "wrong"}"`)}
  </div>
  <div class="review-list">${displayIds.map(id => review(questions[id], result.answers[id], result.answers[id] === questions[id].answer, Boolean(state.notes[id]))).join("") || '<p class="muted">오답과 미응답이 없습니다.</p>'}</div>`;
}
function renderNotes() {
  const active = openNotes();
  const resolved = allQuestions.filter(q => state.notes[q.id]?.resolved);
  const items = view.filter === "resolved" ? resolved : active;
  return `<section class="panel score">
    <div class="eyebrow">복습</div>
    <h1 id="page-heading" tabindex="-1" class="page-title">오답노트</h1>
    <p>틀렸거나 풀지 못한 문제를 모았습니다. 다시 맞히면 복습 완료로 이동합니다.</p>
    <div class="actions">
      ${state.retry || active.length ? primary(state.retry ? "오답 풀이 이어서" : "복습할 문제 다시 풀기", "retry-all") : ""}
      ${active.length || resolved.length ? button("오답노트 내려받기", "export") : ""}
    </div>
  </section>
  <div class="filters" aria-label="오답노트 필터">
    ${button(`복습할 문제 ${active.length}`, "notes-filter", `data-value="open" aria-pressed="${view.filter !== "resolved"}"`)}
    ${button(`복습 완료 ${resolved.length}`, "notes-filter", `data-value="resolved" aria-pressed="${view.filter === "resolved"}"`)}
  </div>
  <div class="review-list">${items.map(q => review(q, state.notes[q.id].answer, state.notes[q.id].resolved, true, true)).join("") ||
    `<p class="muted">${view.filter === "resolved" ? "복습을 완료한 문제가 아직 없습니다." : "복습할 문제가 없습니다. 모의시험을 제출하면 오답과 미응답이 여기 표시됩니다."}</p>`}</div>`;
}
function startRetry(ids) {
  if (!state.retry && !ids.length) return;
  state.retry ||= { ids, answers: {}, index: 0 };
  save();
  navigate({ type: "exam", id: "retry" });
}
function moveTo(index) {
  const draft = getDraft();
  draft.index = Math.max(0, Math.min(draft.ids.length - 1, index));
  save();
  render("#question");
  window.scrollTo(0, 0);
}
function downloadNotes() {
  const noteQuestions = allQuestions.filter(q => state.notes[q.id]);
  const text = noteQuestions.map(q => {
    const note = state.notes[q.id];
    return [
      `## ${q.set}회 ${q.number}번 · ${note.resolved ? "복습 완료" : "복습할 문제"}`,
      q.stem,
      q.options.length === 4 ? q.options.map((option, index) => `${labels[index]} ${option}`).join("\n") : "O / X",
      `${note.resolved ? "이전 오답" : "내 답"} · ${displayAnswer(q, note.answer)}`,
      `정답 · ${displayAnswer(q, q.answer)}`,
      q.explanation,
      `${q.topic} · 규정 근거 ${q.rule} · 난이도 ${q.level}`,
      note.memo ? `내 메모 · ${note.memo}` : ""
    ].filter(Boolean).join("\n");
  });
  const url = URL.createObjectURL(new Blob(["# KPA 지도자 3급 오답노트\n\n", text.join("\n\n")], { type: "text/markdown;charset=utf-8" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = "KPA_3급_오답노트.md";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
document.addEventListener("click", event => {
  const control = event.target.closest("[data-act]");
  if (!control) return;
  const { act, id, value, step } = control.dataset;
  switch (act) {
    case "study": navigate({ type: "study" }); break;
    case "print-study": window.print(); break;
    case "home": navigate({ type: "home" }); break;
    case "notes": navigate({ type: "notes", filter: "open" }); break;
    case "start": start(Number(id)); break;
    case "last": navigate({ type: "results", id: Number(id), filter: "all" }); break;
    case "choose":
    case "clear": {
      const draft = getDraft();
      const qid = draft.ids[draft.index];
      if (act === "clear") delete draft.answers[qid];
      else draft.answers[qid] = Number(value);
      save();
      render(act === "choose" ? `[data-act="choose"][data-value="${value}"]` : '[data-act="choose"]');
      break;
    }
    case "move": moveTo(getDraft().index + Number(step)); break;
    case "jump": moveTo(Number(value)); break;
    case "submit": submit(); break;
    case "result-filter":
    case "notes-filter":
      view.filter = value;
      render(`[data-act="${act}"][data-value="${value}"]`);
      break;
    case "retry-result": {
      const result = view.id === "retry" ? state.retryResult : state.results[view.id];
      startRetry(result.ids.filter(qid => result.answers[qid] !== questions[qid].answer));
      break;
    }
    case "retry-all": startRetry(openNotes().map(q => q.id)); break;
    case "export": downloadNotes(); break;
  }
});
dialog.addEventListener("close", () => {
  const action = pending;
  pending = null;
  if (dialog.returnValue === "accept") action?.();
  dialog.returnValue = "";
});
app.addEventListener("input", event => {
  const id = event.target.dataset.note;
  if (id && state.notes[id]) {
    state.notes[id].memo = event.target.value;
    save();
  }
});
render();
</script>
</body>
</html>
